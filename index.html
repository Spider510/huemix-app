<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;background:#f4f7f4;margin:0;padding:10px}
h1{color:#2e7d32}
label{font-weight:bold;display:block;margin-top:8px}
input,select,button{width:100%;padding:10px;margin-top:4px;font-size:16px;box-sizing:border-box}
button{border:none;color:#fff;border-radius:6px;margin-top:8px}
.green{background:#2e7d32}
.blue{background:#1976d2}
.gray{background:#455a64}
.orange{background:#ef6c00}
.purple{background:#6a1b9a}
.red{background:#c62828}
.table{margin-top:15px;background:#fff;border-radius:10px;padding:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px;border-bottom:1px solid #ddd;text-align:center}
th{background:#eee}
.bar{background:#e8f5e9}
.ec{background:#e3f2fd}
.total{font-weight:bold;background:#f1f1f1}
.smallBtn{padding:4px 8px;font-size:14px;border-radius:4px}
</style>
</head>
<body>

<h1>🌱 HÜMIX Einsatz</h1>

<label>Name</label><input id="name">
<label>Telefon</label><input id="telefon" inputmode="tel">
<label>Straße</label><input id="strasse">
<label>Hausnummer</label><input id="hausnr">
<label>PLZ</label><input id="plz">
<label>Ort</label><input id="ort">

<label>Rasen Säcke (45€)</label><input id="rasen" type="number" value="0">
<label>Bio Säcke (30€)</label><input id="bio" type="number" value="0">

<label>Zahlungsart</label>
<select id="zahlung">
<option>Bar</option>
<option>EC</option>
</select>

<button class="blue" onclick="gpsHolen()">📍 GPS holen</button>
<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="blue" onclick="felderLeeren()">➕ Neuer Eintrag</button>

<button class="gray" onclick="exportTagesCSV()">Tages CSV</button>
<button class="orange" onclick="exportTagesXLS()">Tages XLS</button>
<button class="purple" onclick="exportZusammenfassung()">Tageszusammenfassung CSV</button>
<button class="gray" onclick="exportKundenCSV()">Kunden CSV</button>
<button class="orange" onclick="exportKundenXLS()">Kunden XLS</button>

<div class="table">
<h3>📋 Heutige Einträge</h3>
<div id="heute"></div>
</div>

<div class="table">
<h3>👥 Kundenliste</h3>
<div id="kunden"></div>
</div>

<script>

let editIndex=null;

/* ================= BASIS ================= */

function getDaten(){
return JSON.parse(localStorage.getItem("humix")||"[]")
}

function saveDaten(d){
localStorage.setItem("humix",JSON.stringify(d))
}

/* ================= SPEICHERN ================= */

function speichern(){
let d=getDaten()
let rasen=Number(document.getElementById("rasen").value||0)
let bio=Number(document.getElementById("bio").value||0)

let jetzt=new Date()
let datum=jetzt.toLocaleDateString("de-DE")
let uhr=jetzt.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})

let eintrag={
datum,
uhr,
name:document.getElementById("name").value||"",
telefon:document.getElementById("telefon").value||"",
strasse:document.getElementById("strasse").value||"",
hausnr:document.getElementById("hausnr").value||"",
plz:document.getElementById("plz").value||"",
ort:document.getElementById("ort").value||"",
rasen,
bio,
zahlung:document.getElementById("zahlung").value,
summe:rasen*45+bio*30
}

if(editIndex!==null){
d[editIndex]=eintrag
editIndex=null
}else{
d.push(eintrag)
}

saveDaten(d)
felderLeeren()
anzeigen()
}

/* ================= FELDER ================= */

function felderLeeren(){
["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>document.getElementById(i).value="")
document.getElementById("rasen").value=0
document.getElementById("bio").value=0
}

/* ================= GPS ================= */

function gpsHolen(){
navigator.geolocation.getCurrentPosition(pos=>{
fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
.then(r=>r.json())
.then(d=>{
document.getElementById("strasse").value=d.address.road||""
document.getElementById("hausnr").value=d.address.house_number||""
document.getElementById("plz").value=d.address.postcode||""
document.getElementById("ort").value=d.address.city||d.address.town||d.address.village||""
})
})
}

/* ================= HEUTIGE ================= */

function anzeigen(){
let d=getDaten()
let heute=new Date().toLocaleDateString("de-DE")
let html="<table><tr><th>Uhr</th><th>Ort – Name</th><th>Rasen</th><th>Bio</th><th>Zahlung</th><th>€</th><th></th><th></th></tr>"

let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0

d.forEach((e,i)=>{
if(e.datum===heute){
let klasse=e.zahlung==="Bar"?"bar":"ec"
html+=`<tr class="${klasse}">
<td>${e.uhr}</td>
<td>${e.ort} – ${e.name||"(kein Name)"}</td>
<td>${e.rasen}</td>
<td>${e.bio}</td>
<td>${e.zahlung}</td>
<td>${e.summe}</td>
<td><button class="smallBtn blue" onclick="bearbeiten(${i})">✏</button></td>
<td><button class="smallBtn red" onclick="loeschen(${i})">🗑</button></td>
</tr>`
if(e.zahlung==="Bar"){bR+=e.rasen;bB+=e.bio;bS+=e.summe}
if(e.zahlung==="EC"){eR+=e.rasen;eB+=e.bio;eS+=e.summe}
}
})

html+=`<tr class="total"><td></td><td>BAR</td><td>${bR}</td><td>${bB}</td><td></td><td>${bS}</td><td></td><td></td></tr>`
html+=`<tr class="total"><td></td><td>EC</td><td>${eR}</td><td>${eB}</td><td></td><td>${eS}</td><td></td><td></td></tr>`
html+=`<tr class="total"><td></td><td>GESAMT</td><td>${bR+eR}</td><td>${bB+eB}</td><td></td><td>${bS+eS}</td><td></td><td></td></tr>`

html+="</table>"
document.getElementById("heute").innerHTML=html

kundenliste()
}

/* ================= BEARBEITEN ================= */

function bearbeiten(i){
let e=getDaten()[i]
editIndex=i
document.getElementById("name").value=e.name
document.getElementById("telefon").value=e.telefon
document.getElementById("strasse").value=e.strasse
document.getElementById("hausnr").value=e.hausnr
document.getElementById("plz").value=e.plz
document.getElementById("ort").value=e.ort
document.getElementById("rasen").value=e.rasen
document.getElementById("bio").value=e.bio
document.getElementById("zahlung").value=e.zahlung
}

function loeschen(i){
let d=getDaten()
d.splice(i,1)
saveDaten(d)
anzeigen()
}

/* ================= KUNDEN ================= */

function kundenliste(){
let d=getDaten()
let map={}
d.forEach((e,i)=>{
let key=e.ort+"|"+e.name
if(!map[key]) map[key]={...e,index:i}
})
let html="<table><tr><th>Ort</th><th>Name</th><th>Telefon</th><th></th><th></th></tr>"
Object.values(map).forEach(k=>{
html+=`<tr>
<td>${k.ort}</td>
<td>${k.name||"(kein Name)"}</td>
<td>${k.telefon||""}</td>
<td><button class="smallBtn blue" onclick="bearbeiten(${k.index})">✏</button></td>
<td><button class="smallBtn red" onclick="kundeLoeschen('${k.ort}','${k.name}')">🗑</button></td>
</tr>`
})
html+="</table>"
document.getElementById("kunden").innerHTML=html
}

function kundeLoeschen(ort,name){
let d=getDaten().filter(e=>!(e.ort===ort && e.name===name))
saveDaten(d)
anzeigen()
}

/* ================= EXPORT ================= */

function exportTagesCSV(){
let d=getDaten()
if(!d.length)return
let csv="Datum;Uhr;Name;Telefon;Straße;Hausnr;PLZ;Ort;Rasen;Bio;Zahlung;Summe €\n"
d.forEach(e=>{
csv+=`${e.datum};${e.uhr};${e.name};="${e.telefon}";${e.strasse};${e.hausnr};${e.plz};${e.ort};${e.rasen};${e.bio};${e.zahlung};${e.summe}\n`
})
download(csv,"tagesliste.csv")
}

function exportZusammenfassung(){
let d=getDaten()
if(!d.length)return
let heute=new Date().toLocaleDateString("de-DE")
let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0
d.forEach(e=>{
if(e.datum===heute){
if(e.zahlung==="Bar"){bR+=e.rasen;bB+=e.bio;bS+=e.summe}
if(e.zahlung==="EC"){eR+=e.rasen;eB+=e.bio;eS+=e.summe}
}
})
let csv="Datum;Zahlung;Rasen;Bio;Summe €\n"
csv+=`${heute};Bar;${bR};${bB};${bS}\n`
csv+=`${heute};EC;${eR};${eB};${eS}\n`
csv+=`${heute};GESAMT;${bR+eR};${bB+eB};${bS+eS}`
download(csv,"zusammenfassung.csv")
}

function exportKundenCSV(){
let d=getDaten()
let csv="Ort;Name;Telefon\n"
d.forEach(e=>{
csv+=`${e.ort};${e.name};="${e.telefon}"\n`
})
download(csv,"kunden.csv")
}

function exportTagesXLS(){
let d=getDaten()
let ws=XLSX.utils.json_to_sheet(d)
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"Tagesliste")
XLSX.writeFile(wb,"tagesliste.xlsx")
}

function exportKundenXLS(){
let d=getDaten()
let ws=XLSX.utils.json_to_sheet(d.map(e=>({Ort:e.ort,Name:e.name,Telefon:e.telefon})))
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"Kunden")
XLSX.writeFile(wb,"kunden.xlsx")
}

function download(text,name){
let blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"})
let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download=name
a.click()
}

anzeigen()

</script>
</body>
</html>
