<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f4f7f4; margin:0; padding:10px; }
h1 { color:#2e7d32; }
label { font-weight:bold; display:block; margin-top:10px; }
input, select, button {
  width:100%; padding:10px; margin-top:5px;
  font-size:16px; box-sizing:border-box;
}
button { border:none; color:#fff; cursor:pointer; margin-top:10px; }
.green { background:#2e7d32; }
.blue { background:#1976d2; }
.gray { background:#455a64; }
.orange { background:#ef6c00; }
.red { background:#c62828; }
.status { margin-top:10px; font-size:14px; }
fieldset { border:1px solid #ccc; padding:10px; margin-top:10px; }
legend { font-weight:bold; }
</style>
</head>

<body>

<h1>🌱 HÜMIX Einsatz</h1>

<label>Name</label>
<input id="name">

<label>Telefon</label>
<input id="telefon" inputmode="tel">

<label>Straße</label>
<input id="strasse">

<label>Hausnummer</label>
<input id="hausnr">

<label>PLZ</label>
<input id="plz">

<label>Ort</label>
<input id="ort">

<fieldset>
<legend>Rasendünger</legend>
<label>Säcke</label>
<input id="rasen_saecke" type="number" value="0">

<label>kg pro Sack</label>
<input id="rasen_kg" type="number" value="20">

<label>Preis pro Sack (€)</label>
<input id="rasen_preis" type="number" value="45">
</fieldset>

<fieldset>
<legend>Bio-Dünger</legend>
<label>Säcke</label>
<input id="bio_saecke" type="number" value="0">

<label>Liter pro Sack</label>
<input id="bio_liter" type="number" value="65">

<label>Preis pro Sack (€)</label>
<input id="bio_preis" type="number" value="30">
</fieldset>

<label>Ausgestreut</label>
<select id="ausgestreut">
  <option>Ja</option>
  <option>Nein</option>
</select>

<label>Zahlungsart</label>
<select id="zahlung">
  <option>Bar</option>
  <option>EC</option>
</select>

<button class="blue" onclick="gpsHolen()">📍 GPS neu holen</button>
<div class="status" id="gpsStatus">GPS noch nicht ermittelt</div>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
<button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button>
<button class="gray" onclick="exportZusammenfassung()">📊 Tageszusammenfassung CSV</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button>

<div class="status" id="status">Bereit.</div>

<script>
/* ===== Standardwerte ===== */
const STANDARD_RASEN_KG = 20;
const STANDARD_RASEN_PREIS = 45;
const STANDARD_BIO_LITER = 65;
const STANDARD_BIO_PREIS = 30;

/* ===== GPS ===== */
function gpsHolen(){
  navigator.geolocation.getCurrentPosition(pos=>{
    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
      .then(r=>r.json()).then(d=>{
        strasse.value = d.address.road || "";
        hausnr.value  = d.address.house_number || "";
        plz.value     = d.address.postcode || "";
        ort.value     = d.address.city || d.address.town || d.address.village || "";
        gpsStatus.innerText = "GPS OK";
      });
  });
}

/* ===== Speichern ===== */
function speichern(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]");

  const rS = Number(rasen_saecke.value||0);
  const bS = Number(bio_saecke.value||0);
  const rPreis = Number(rasen_preis.value||0);
  const bPreis = Number(bio_preis.value||0);

  const summe = rS*rPreis + bS*bPreis;
  const jetzt = new Date();

  daten.push({
    datum: jetzt.toLocaleDateString("de-DE"),
    uhrzeit: jetzt.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
    name: name.value,
    telefon: telefon.value,
    ort: ort.value,
    rasen_saecke: rS,
    rasen_kg: rasen_kg.value,
    rasen_preis: rPreis,
    bio_saecke: bS,
    bio_liter: bio_liter.value,
    bio_preis: bPreis,
    zahlung: zahlung.value,
    summe
  });

  localStorage.setItem("humix", JSON.stringify(daten));

  /* ===== Reset auf Standard ===== */
  rasen_kg.value = STANDARD_RASEN_KG;
  rasen_preis.value = STANDARD_RASEN_PREIS;
  bio_liter.value = STANDARD_BIO_LITER;
  bio_preis.value = STANDARD_BIO_PREIS;
  rasen_saecke.value = 0;
  bio_saecke.value = 0;

  status.innerText = "Gespeichert ✔";
}

/* ===== Tages CSV ===== */
function exportTagesCSV(){
  const daten = JSON.parse(localStorage.getItem("humix")||"[]");
  let csv = "Datum;Uhrzeit;Name;Ort;Rasen Säcke;kg/Sack;Preis €;Bio Säcke;L/Sack;Preis €;Zahlung;Summe €\n";
  daten.forEach(e=>{
    csv += `${e.datum};${e.uhrzeit};${e.name};${e.ort};${e.rasen_saecke};${e.rasen_kg};${e.rasen_preis};${e.bio_saecke};${e.bio_liter};${e.bio_preis};${e.zahlung};${e.summe}\n`;
  });
  download(csv,"humix_tagesliste.csv");
}

/* ===== Tageszusammenfassung ===== */
function exportZusammenfassung(){
  const daten = JSON.parse(localStorage.getItem("humix")||"[]");
  let sumBar=0,sumEC=0;
  daten.forEach(e=>{
    if(e.zahlung==="Bar") sumBar+=e.summe;
    if(e.zahlung==="EC") sumEC+=e.summe;
  });

  let csv =
`Datum;Standard Rasen;Preis;Standard Bio;Preis
${new Date().toLocaleDateString("de-DE")};${STANDARD_RASEN_KG}kg;${STANDARD_RASEN_PREIS}€;${STANDARD_BIO_LITER}L;${STANDARD_BIO_PREIS}€
Bar;;;;${sumBar}
EC;;;;${sumEC}
GESAMT;;;;${sumBar+sumEC}`;

  download(csv,"humix_tageszusammenfassung.csv");
}

/* ===== XLSX ===== */
function exportXLSX(){
  const daten = JSON.parse(localStorage.getItem("humix")||"[]");
  const sheet = [["Datum","Uhrzeit","Name","Ort","Rasen Säcke","kg","Preis","Bio Säcke","L","Preis","Zahlung","Summe"]];
  daten.forEach(e=>{
    sheet.push([e.datum,e.uhrzeit,e.name,e.ort,e.rasen_saecke,e.rasen_kg,e.rasen_preis,e.bio_saecke,e.bio_liter,e.bio_preis,e.zahlung,e.summe]);
  });
  const ws = XLSX.utils.aoa_to_sheet(sheet);
  ws["!cols"] = sheet[0].map((_,i)=>({wch:Math.max(...sheet.map(r=>String(r[i]||"").length))+2}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"HÜMIX");
  XLSX.writeFile(wb,"humix.xlsx");
}

/* ===== CSV Download ===== */
function download(text,name){
  const blob = new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

function allesLoeschen(){
  if(confirm("Alles löschen?")){
    localStorage.removeItem("humix");
  }
}
</script>
</body>
</html>
