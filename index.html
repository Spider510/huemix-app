<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial, sans-serif; background:#f4f7f4; padding:10px; }
h1,h2 { color:#2e7d32; }

label { font-weight:bold; display:block; margin-top:10px; }
input, select, button {
  width:100%; padding:10px; margin-top:5px;
  font-size:16px; box-sizing:border-box;
}

button { border:none; color:#fff; margin-top:10px; cursor:pointer; }
.green{background:#2e7d32;}
.blue{background:#1976d2;}
.red{background:#c62828;}

table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff;}
th,td{border:1px solid #ccc;padding:6px;font-size:14px;}
th{background:#e8f5e9;}

.bar{background:#e8f5e9;}
.ec{background:#e3f2fd;}
</style>
</head>

<body>

<h1>🌱 HÜMIX Einsatz</h1>

<input type="hidden" id="editId">

<label>Name</label>
<input id="name" placeholder="optional">

<label>Ort</label>
<input id="ort">

<label>Rasen Säcke (45 €)</label>
<input id="rasen" type="number" value="0">

<label>Bio Säcke (30 €)</label>
<input id="bio" type="number" value="0">

<label>Zahlung</label>
<select id="zahlung">
  <option>Bar</option>
  <option>EC</option>
</select>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button>

<h2>📋 Heutige Einträge</h2>

<table>
<thead>
<tr>
<th>Uhrzeit</th>
<th>Ort – Name</th>
<th>€</th>
</tr>
</thead>
<tbody id="liste"></tbody>
</table>

<script>
function $(id){ return document.getElementById(id); }

function heute(){
  return new Date().toLocaleDateString("de-DE");
}

/* ================= SPEICHERN (SAFARI-SICHER) ================= */
function speichern(){
  try {
    const daten = JSON.parse(localStorage.getItem("humix") || "[]");

    const nameVal = $("name").value.trim() || "(kein Name)";
    const ortVal  = $("ort").value.trim() || "";
    const rasen   = Number($("rasen").value || 0);
    const bio     = Number($("bio").value || 0);
    const summe   = rasen * 45 + bio * 30;

    const id = $("editId").value || (Date.now() + "_" + Math.random().toString(16).slice(2));

    const eintrag = {
      id: id,
      datum: heute(),
      uhrzeit: new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
      name: nameVal,
      ort: ortVal,
      summe: summe,
      zahlung: $("zahlung").value
    };

    const idx = daten.findIndex(e => e.id === id);
    if(idx >= 0) daten[idx] = eintrag;
    else daten.push(eintrag);

    localStorage.setItem("humix", JSON.stringify(daten));

    $("editId").value = "";
    $("name").value = "";
    $("ort").value = "";
    $("rasen").value = 0;
    $("bio").value = 0;

    anzeigen();

  } catch(err){
    alert("Fehler beim Speichern:\n" + err.message);
  }
}

/* ================= ANZEIGE HEUTE ================= */
function anzeigen(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e => e.datum === heute())
    .sort((a,b) => a.ort.localeCompare(b.ort));

  $("liste").innerHTML = "";

  daten.forEach(e => {
    $("liste").innerHTML += `
      <tr class="${e.zahlung === 'Bar' ? 'bar' : 'ec'}">
        <td>${e.uhrzeit}</td>
        <td>${e.ort} – ${e.name}</td>
        <td>${e.summe}</td>
      </tr>`;
  });
}

/* ================= ALLES LÖSCHEN ================= */
function allesLoeschen(){
  if(confirm("Wirklich alle Daten löschen?")){
    localStorage.removeItem("humix");
    anzeigen();
  }
}

anzeigen();
</script>

</body>
</html>
