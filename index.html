<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HÜMIX Einsatz</title>

<style>
body{font-family:Arial;background:#f4f7f4;margin:0;padding:10px}
h1{color:#2e7d32}
label{font-weight:bold}
input,select,button{width:100%;padding:8px;margin-bottom:10px}
button{border:none;color:#fff;font-size:16px}
.green{background:#2e7d32}
.blue{background:#1976d2}
.purple{background:#7b1fa2}
.red{background:#c62828}
.gray{background:#455a64}
.info{padding:8px;background:#eee}
</style>
</head>

<body>

<h1>🌱 HÜMIX Einsatz</h1>

<label>Name</label>
<input id="name">

<label>Telefon</label>
<input id="telefon">

<label>Straße</label>
<input id="strasse">

<label>Hausnummer</label>
<input id="hausnr">

<label>PLZ</label>
<input id="plz">

<label>Ort</label>
<input id="ort">

<label>Rasen – Säcke</label>
<input id="rasen" type="number" value="0">

<label>Rasen Preis (€)</label>
<input id="rasenPreis" type="number" value="45">

<label>Rasen kg</label>
<input id="rasenKg" type="number" value="20">

<label>Bio – Säcke</label>
<input id="bio" type="number" value="0">

<label>Bio Preis (€)</label>
<input id="bioPreis" type="number" value="30">

<label>Bio Liter</label>
<input id="bioL" type="number" value="65">

<label>Ausgestreut</label>
<select id="ausgestreut">
  <option>Ja</option>
  <option>Nein</option>
</select>

<label>Zahlungsart</label>
<select id="zahlung">
  <option>Bar</option>
  <option>EC</option>
</select>

<button class="blue" onclick="gpsNeu()">📍 GPS neu holen</button>
<div id="gpsInfo" class="info">GPS noch nicht ermittelt</div>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="gray" onclick="exportCSV()">📄 Tages-CSV</button>
<button class="purple" onclick="exportXLSX()">📊 XLSX Export</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
const STD = { rasenPreis:45, bioPreis:30, rasenKg:20, bioL:65 };
let gps = null;

function num(v){return Number(String(v).replace(",","."))||0}

function gpsNeu(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.getElementById("rasen").value=0;
  document.getElementById("bio").value=0;
  if(!navigator.geolocation){alert("GPS nicht verfügbar");return}
  navigator.geolocation.getCurrentPosition(p=>{
    gps = {lat:p.coords.latitude,lon:p.coords.longitude};
    document.getElementById("gpsInfo").innerText =
      `GPS OK: ${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)}`;
  });
}

function speichern(){
  const e = {
    datum:new Date().toLocaleString("de-DE",{hour:"2-digit",minute:"2-digit"}),
    name:document.getElementById("name").value,
    telefon:"'"+document.getElementById("telefon").value,
    strasse:document.getElementById("strasse").value,
    hausnr:document.getElementById("hausnr").value,
    plz:"'"+document.getElementById("plz").value,
    ort:document.getElementById("ort").value,
    rasen:num(rasen.value),
    bio:num(bio.value),
    rasenPreis:num(rasenPreis.value),
    bioPreis:num(bioPreis.value),
    ausg:ausgestreut.value,
    zahlung:zahlung.value,
    summe:num(rasen.value)*num(rasenPreis.value)+num(bio.value)*num(bioPreis.value)
  };
  const d = JSON.parse(localStorage.getItem("humix")||"[]");
  d.push(e);
  localStorage.setItem("humix",JSON.stringify(d));

  document.querySelectorAll("input").forEach(i=>i.value="");
  rasenPreis.value=STD.rasenPreis;
  bioPreis.value=STD.bioPreis;
  rasenKg.value=STD.rasenKg;
  bioL.value=STD.bioL;
  gpsInfo.innerText="Bereit.";
}

function exportCSV(){
  const d = JSON.parse(localStorage.getItem("humix")||"[]");
  let csv="Datum;Zahlung;Rasen;Bio;Summe\n";
  d.forEach(e=>{
    csv+=`${e.datum.split(" ")[0]};${e.zahlung};${e.rasen};${e.bio};${e.summe}\n`;
  });
  download(csv,"humix_tag.csv");
}

function exportXLSX(){
  const d = JSON.parse(localStorage.getItem("humix")||"[]");
  const ws = XLSX.utils.json_to_sheet(d);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"HÜMIX");
  XLSX.writeFile(wb,"humix.xlsx");
}

function allesLoeschen(){
  if(confirm("Alles löschen?")) localStorage.removeItem("humix");
}

function download(t,n){
  const b=new Blob(["\uFEFF"+t],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download=n;
  a.click();
}
</script>

</body>
</html>
