<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- SheetJS für XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* ================= Modern UI (nur Design, keine Logik) ================= */
:root{
  --bg: #0b1220;
  --surface: rgba(255,255,255,.06);
  --surface2: rgba(255,255,255,.09);
  --border: rgba(255,255,255,.12);
  --text: rgba(255,255,255,.92);
  --muted: rgba(255,255,255,.70);

  --primary: #2e7d32;   /* HÜMIX grün */
  --blue: #1976d2;
  --gray: #455a64;
  --purple: #6a1b9a;
  --orange: #ef6c00;
  --red: #c62828;

  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --radius: 16px;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }

body{
  margin:0;
  padding:18px 14px 26px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background:
    radial-gradient(900px 500px at 20% 0%, rgba(46,125,50,.35), transparent 55%),
    radial-gradient(900px 500px at 100% 15%, rgba(25,118,210,.25), transparent 60%),
    radial-gradient(1100px 700px at 40% 110%, rgba(106,27,154,.18), transparent 55%),
    var(--bg);
  color: var(--text);
}

.container{
  max-width: 980px;
  margin: 0 auto;
}

.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom: 14px;
}

h1{
  margin:0;
  font-size: 26px;
  letter-spacing: .2px;
  line-height: 1.15;
}
.subtitle{
  margin-top:6px;
  color: var(--muted);
  font-size: 13px;
}

.card{
  background: linear-gradient(180deg, var(--surface), rgba(255,255,255,.04));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.grid{
  display:grid;
  grid-template-columns: 1fr;
  gap:12px;
}

@media (min-width: 720px){
  .grid{ grid-template-columns: repeat(12, 1fr); }
  .col-6{ grid-column: span 6; }
  .col-4{ grid-column: span 4; }
  .col-3{ grid-column: span 3; }
  .col-12{ grid-column: span 12; }
}

.sectionTitle{
  margin: 18px 0 10px;
  font-size: 18px;
  font-weight: 750;
  letter-spacing: .2px;
}

label{
  display:block;
  font-weight: 650;
  font-size: 12px;
  letter-spacing: .2px;
  color: var(--muted);
  margin-bottom: 6px;
}

input, select, button{
  font-size: 16px;
}

input, select{
  width:100%;
  padding: 12px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,.18);
  color: var(--text);
  outline: none;
  transition: border-color .15s ease, transform .05s ease, background .15s ease;
}

input::placeholder{ color: rgba(255,255,255,.45); }

input:focus, select:focus{
  border-color: rgba(46,125,50,.85);
  background: rgba(0,0,0,.26);
}

select{
  appearance:none;
  background-image:
    linear-gradient(45deg, transparent 50%, rgba(255,255,255,.7) 50%),
    linear-gradient(135deg, rgba(255,255,255,.7) 50%, transparent 50%);
  background-position:
    calc(100% - 18px) calc(50% - 3px),
    calc(100% - 12px) calc(50% - 3px);
  background-size: 6px 6px, 6px 6px;
  background-repeat:no-repeat;
  padding-right: 34px;
}

.btnRow{
  display:grid;
  grid-template-columns: 1fr;
  gap:10px;
  margin-top: 10px;
}

@media (min-width: 720px){
  .btnRow{ grid-template-columns: repeat(12, 1fr); }
  .btnSpan6{ grid-column: span 6; }
  .btnSpan4{ grid-column: span 4; }
  .btnSpan3{ grid-column: span 3; }
  .btnSpan12{ grid-column: span 12; }
}

button{
  width:100%;
  padding: 12px 12px;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 12px;
  color:#fff;
  cursor:pointer;
  transition: transform .06s ease, filter .15s ease, opacity .15s ease;
  box-shadow: 0 10px 24px rgba(0,0,0,.22);
  font-weight: 700;
  letter-spacing: .15px;
}

button:hover{ filter: brightness(1.05); }
button:active{ transform: translateY(1px); }

.green { background: linear-gradient(180deg, rgba(46,125,50,1), rgba(27,94,32,1)); }
.blue  { background: linear-gradient(180deg, rgba(25,118,210,1), rgba(13,71,161,1)); }
.gray  { background: linear-gradient(180deg, rgba(69,90,100,1), rgba(38,50,56,1)); }
.purple{ background: linear-gradient(180deg, rgba(106,27,154,1), rgba(74,20,140,1)); }
.orange{ background: linear-gradient(180deg, rgba(239,108,0,1), rgba(230,81,0,1)); }
.red   { background: linear-gradient(180deg, rgba(198,40,40,1), rgba(183,28,28,1)); }

.status{
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px dashed rgba(255,255,255,.18);
  background: rgba(0,0,0,.14);
}

.tableCard{
  margin-top: 12px;
  padding: 0;
  overflow: hidden;
}

.tableWrap{
  overflow:auto;
  -webkit-overflow-scrolling: touch;
}

table{
  width:100%;
  border-collapse: separate;
  border-spacing: 0;
  background: transparent;
  min-width: 760px;
}

th, td{
  padding: 10px 10px;
  font-size: 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  white-space: nowrap;
}

thead th{
  position: sticky;
  top: 0;
  z-index: 2;
  background: rgba(10,16,28,.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: rgba(255,255,255,.9);
  text-align:left;
  font-weight: 800;
  border-bottom: 1px solid rgba(255,255,255,.12);
}

tbody tr:hover{
  background: rgba(255,255,255,.04);
}

.bar { background: rgba(46,125,50,.12); }
.ec  { background: rgba(25,118,210,.12); }

.summe{
  font-weight: 900;
  background: rgba(255,255,255,.06);
}

tfoot tr td{
  position: sticky;
  bottom: 0;
  background: rgba(10,16,28,.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255,255,255,.12);
}

.actionBtn{
  padding: 8px 10px;
  font-size: 12px;
  width:auto;
  border-radius: 10px;
  box-shadow: none;
}

.badgeRow{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
}

.badge{
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.18);
  padding: 8px 10px;
  border-radius: 999px;
}

/* schöner Abstand am Ende */
.spacer{ height: 14px; }
</style>
</head>

<body>
  <div class="container">

    <div class="header">
      <div>
        <h1>🌱 HÜMIX Einsatz</h1>
        <div class="subtitle">Schnell erfassen, speichern und als CSV/XLSX exportieren – alles lokal im Browser.</div>
      </div>
      <div class="badgeRow">
        <div class="badge">📦 Rasen: 45 €</div>
        <div class="badge">🌿 Bio: 30 €</div>
      </div>
    </div>

    <div class="card">
      <input type="hidden" id="editId">

      <div class="grid">
        <div class="col-6">
          <label>Name</label>
          <input id="name" placeholder="optional">
        </div>

        <div class="col-6">
          <label>Telefon</label>
          <input id="telefon" inputmode="tel">
        </div>

        <div class="col-6">
          <label>Straße</label>
          <input id="strasse">
        </div>

        <div class="col-3">
          <label>Hausnummer</label>
          <input id="hausnr">
        </div>

        <div class="col-3">
          <label>PLZ</label>
          <input id="plz">
        </div>

        <div class="col-6">
          <label>Ort</label>
          <input id="ort">
        </div>

        <div class="col-3">
          <label>Rasen Spezial – Säcke (45 €)</label>
          <input id="rasen" type="number" value="0">
        </div>

        <div class="col-3">
          <label>Bio-Volldünger – Säcke (30 €)</label>
          <input id="bio" type="number" value="0">
        </div>

        <div class="col-3">
          <label>Ausgestreut</label>
          <select id="ausgestreut">
            <option>Ja</option>
            <option>Nein</option>
          </select>
        </div>

        <div class="col-3">
          <label>Zahlungsart</label>
          <select id="zahlung">
            <option>Bar</option>
            <option>EC</option>
          </select>
        </div>

        <div class="col-12 btnRow">
          <div class="btnSpan6">
            <button class="blue" onclick="gpsHolen()">📍 GPS holen</button>
            <div class="status" id="gpsStatus">GPS noch nicht ermittelt</div>
          </div>

          <div class="btnSpan6" style="display:grid; gap:10px;">
            <button class="green" onclick="speichern()">💾 Speichern</button>
            <button class="blue" onclick="neuerEintrag()">➕ Neuer Eintrag</button>
          </div>

          <div class="btnSpan3"><button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button></div>
          <div class="btnSpan3"><button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button></div>
          <div class="btnSpan3"><button class="purple" onclick="exportZusammenfassung()">📊 Tageszusammenfassung CSV</button></div>
          <div class="btnSpan3"><button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button></div>
        </div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="sectionTitle">📋 Heutige Einträge</div>

    <div class="card tableCard">
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Uhrzeit</th>
              <th>Ort – Name</th>
              <th>Rasen</th>
              <th>Bio</th>
              <th>Zahlung</th>
              <th>€</th>
              <th>Aktion</th>
            </tr>
          </thead>
          <tbody id="tabelleHeute"></tbody>
          <tfoot id="summenHeute"></tfoot>
        </table>
      </div>
    </div>

  </div>

<script>
function el(id){ return document.getElementById(id); }
function heuteDatum(){ return new Date().toLocaleDateString("de-DE"); }
function toNum(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }

/* ================= GPS ================= */
function gpsHolen(){
  neuerEintrag();
  el("gpsStatus").innerText="GPS wird ermittelt…";

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
      .then(r=>r.json())
      .then(d=>{
        el("strasse").value=d.address?.road||"";
        el("hausnr").value=d.address?.house_number||"";
        el("plz").value=d.address?.postcode||"";
        el("ort").value=d.address?.city||d.address?.town||d.address?.village||"";
        el("gpsStatus").innerText=`GPS OK: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      });
  }, ()=>alert("GPS nicht verfügbar"));
}

/* ================= SPEICHERN ================= */
function speichern(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]");

  const rasen = toNum(el("rasen").value || 0);
  const bio   = toNum(el("bio").value || 0);
  const summe = rasen*45 + bio*30;

  const id = el("editId").value || (Date.now()+"_"+Math.random());

  const eintrag = {
    id,
    datum: heuteDatum(),
    uhrzeit: new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
    name: (el("name").value || "").trim() || "(kein Name)",
    telefon: el("telefon").value || "",
    strasse: el("strasse").value || "",
    hausnr: el("hausnr").value || "",
    plz: el("plz").value || "",
    ort: el("ort").value || "",
    rasen, bio,
    ausgestreut: el("ausgestreut").value,
    zahlung: el("zahlung").value,
    summe
  };

  const i = daten.findIndex(e=>e.id===id);
  if(i>=0) daten[i]=eintrag; else daten.push(eintrag);

  localStorage.setItem("humix", JSON.stringify(daten));
  neuerEintrag();
  ladeHeute();
}

/* ================= RESET ================= */
function neuerEintrag(){
  el("editId").value="";
  ["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>el(i).value="");
  el("rasen").value=0;
  el("bio").value=0;
  el("gpsStatus").innerText="GPS noch nicht ermittelt";
}

/* ================= HEUTE + SUMMEN ================= */
function ladeHeute(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  const tbody = el("tabelleHeute");
  const tfoot = el("summenHeute");
  tbody.innerHTML="";
  tfoot.innerHTML="";

  let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;

  daten.forEach(e=>{
    const ras = toNum(e.rasen);
    const bi  = toNum(e.bio);
    const su  = toNum(e.summe);

    if(e.zahlung==="Bar"){ bR+=ras; bB+=bi; bS+=su; }
    if(e.zahlung==="EC"){  eR+=ras; eB+=bi; eS+=su; }

    tbody.innerHTML += `
      <tr class="${e.zahlung==="Bar" ? "bar" : "ec"}">
        <td>${e.uhrzeit || ""}</td>
        <td>${(e.ort||"")} – ${(e.name||"")}</td>
        <td>${ras}</td>
        <td>${bi}</td>
        <td>${e.zahlung||""}</td>
        <td>${su}</td>
        <td>
          <button class="blue actionBtn" onclick="bearbeiten('${e.id}')">✏️</button>
          <button class="red actionBtn" onclick="loeschen('${e.id}')">🗑</button>
        </td>
      </tr>`;
  });

  tfoot.innerHTML = `
    <tr class="summe bar">
      <td colspan="2">BAR</td><td>${bR}</td><td>${bB}</td><td></td><td>${bS}</td><td></td>
    </tr>
    <tr class="summe ec">
      <td colspan="2">EC</td><td>${eR}</td><td>${eB}</td><td></td><td>${eS}</td><td></td>
    </tr>
    <tr class="summe">
      <td colspan="2">GESAMT</td><td>${bR+eR}</td><td>${bB+eB}</td><td></td><td>${bS+eS}</td><td></td>
    </tr>`;
}

function bearbeiten(id){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]");
  const e = daten.find(x=>x.id===id);
  if(!e) return;

  el("editId").value = e.id;
  el("name").value = (e.name && e.name !== "(kein Name)") ? e.name : "";
  el("telefon").value = e.telefon || "";
  el("strasse").value = e.strasse || "";
  el("hausnr").value = e.hausnr || "";
  el("plz").value = e.plz || "";
  el("ort").value = e.ort || "";
  el("rasen").value = toNum(e.rasen);
  el("bio").value = toNum(e.bio);
  el("ausgestreut").value = e.ausgestreut || "Ja";
  el("zahlung").value = e.zahlung || "Bar";
}

function loeschen(id){
  if(!confirm("Eintrag löschen?")) return;
  const daten = JSON.parse(localStorage.getItem("humix") || "[]").filter(e=>e.id!==id);
  localStorage.setItem("humix", JSON.stringify(daten));
  ladeHeute();
}

/* ================= DOWNLOAD CSV (BOM für Umlaute) ================= */
function downloadCSV(text, name){
  const blob = new Blob(["\uFEFF"+text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ================= EXPORT: Tages-CSV ================= */
function exportTagesCSV(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  let csv = "Datum;Uhrzeit;Name;Telefon;Straße;Hausnr;PLZ;Ort;Rasen;Bio;Ausgestreut;Zahlung;Summe €\n";

  daten.forEach(e=>{
    const tel = String(e.telefon || "").replace(/"/g,'""'); // Excel-freundlich
    csv += `${e.datum};${e.uhrzeit};${e.name||""};="${tel}";${e.strasse||""};${e.hausnr||""};${e.plz||""};${e.ort||""};${toNum(e.rasen)};${toNum(e.bio)};${e.ausgestreut||""};${e.zahlung||""};${toNum(e.summe)}\n`;
  });

  const dateName = new Date().toISOString().slice(0,10); // yyyy-mm-dd
  downloadCSV(csv, `humix_tagesliste_${dateName}.csv`);
}

/* ================= EXPORT: XLSX (heute + Auto-Spaltenbreite) ================= */
function exportXLSX(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  const sheetData = [
    ["Datum","Uhrzeit","Name","Telefon","Straße","Hausnr","PLZ","Ort","Rasen","Bio","Ausgestreut","Zahlung","Summe €"]
  ];

  daten.forEach(e=>{
    sheetData.push([
      e.datum,
      e.uhrzeit,
      e.name || "",
      e.telefon || "",
      e.strasse || "",
      e.hausnr || "",
      e.plz || "",
      e.ort || "",
      toNum(e.rasen),
      toNum(e.bio),
      e.ausgestreut || "",
      e.zahlung || "",
      toNum(e.summe)
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(sheetData);

  // Auto-Spaltenbreite
  ws["!cols"] = sheetData[0].map((_, i) => ({
    wch: Math.max(...sheetData.map(r => String(r[i] ?? "").length)) + 2
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "HÜMIX");

  const dateName = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `humix_tagesliste_${dateName}.xlsx`);
}

/* ================= EXPORT: Tageszusammenfassung CSV (heute) ================= */
function exportZusammenfassung(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  const datum = heuteDatum();
  let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;

  daten.forEach(e=>{
    const ras = toNum(e.rasen);
    const bi  = toNum(e.bio);
    const su  = toNum(e.summe);
    if(e.zahlung==="Bar"){ bR+=ras; bB+=bi; bS+=su; }
    if(e.zahlung==="EC"){  eR+=ras; eB+=bi; eS+=su; }
  });

  let csv = "Datum;Zahlung;Rasen Säcke;Bio Säcke;Summe €\n";
  csv += `${datum};Bar;${bR};${bB};${bS}\n`;
  csv += `${datum};EC;${eR};${eB};${eS}\n`;
  csv += `${datum};GESAMT;${bR+eR};${bB+eB};${bS+eS}\n`;

  const dateName = new Date().toISOString().slice(0,10);
  downloadCSV(csv, `humix_tageszusammenfassung_${dateName}.csv`);
}

/* ================= ALLES LÖSCHEN ================= */
function allesLoeschen(){
  if(confirm("Wirklich alle Daten löschen?")){
    localStorage.removeItem("humix");
    neuerEintrag();
    ladeHeute();
    alert("Gelöscht");
  }
}

window.onload = ladeHeute;
</script>

</body>
</html>
