<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<!-- SheetJS für XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --border:#334155;
  --text:#f1f5f9;
  --muted:#94a3b8;
}
body.light{
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#1e293b;
  --muted:#64748b;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  padding:12px;
  font-size:16px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
h1{ margin:0; font-size:20px; }

.themeToggle{
  padding:8px 12px;
  border-radius:18px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:14px;
  cursor:pointer;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

label{
  font-size:13px;
  font-weight:650;
  color:var(--muted);
  margin-bottom:4px;
  display:block;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  font-size:16px; /* verhindert iOS Zoom */
  margin-bottom:10px;
}

button{
  width:100%;
  padding:16px;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:14px;
  margin-top:8px;
  color:#fff;
  cursor:pointer;
}

.green{background:#2e7d32}
.blue{background:#1976d2}
.gray{background:#455a64}
.purple{background:#6a1b9a}
.orange{background:#ef6c00}
.red{background:#c62828}

.status{
  font-size:13px;
  color:var(--muted);
  margin:6px 0 10px;
}

/* Untermenü */
.submenu{
  overflow:hidden;
  max-height:0;
  transition:max-height .3s ease;
}
.submenu.open{ max-height:900px; }

/* Preise: 2 Spalten, auf kleinen Handys 1 Spalte */
.priceGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media (max-width:420px){
  .priceGrid{ grid-template-columns:1fr; }
}
.hint{
  font-size:12px;
  color:var(--muted);
  margin:-6px 0 10px;
}

/* Tabelle + horizontal scroll am Handy */
.tableWrap{ overflow:auto; -webkit-overflow-scrolling:touch; }
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  min-width: 860px;
}
th,td{
  padding:8px;
  border-bottom:1px solid var(--border);
  text-align:left;
  vertical-align:top;
  white-space:nowrap;
}
thead th{
  position:sticky;
  top:0;
  background:var(--card);
  z-index:1;
}
.bar{background:rgba(46,125,50,.15)}
.ec{background:rgba(25,118,210,.15)}
.summe{font-weight:800}

.actionBtn{
  padding:8px 10px;
  font-size:13px;
  border-radius:10px;
  width:auto;
  margin-right:6px;
}
</style>
</head>

<body>

<div class="topbar">
  <h1>🌱 HÜMIX Einsatz</h1>
  <button class="themeToggle" onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="card">
  <input type="hidden" id="editId">

  <label>Name</label>
  <input id="name" placeholder="optional">

  <label>Telefon</label>
  <input id="telefon" inputmode="tel">

  <label>Straße</label>
  <input id="strasse">

  <label>Hausnummer</label>
  <input id="hausnr">

  <label>PLZ</label>
  <input id="plz" inputmode="numeric">

  <label>Ort</label>
  <input id="ort">

  <label>Rasen Spezial – Säcke (Standard 45 €)</label>
  <input id="rasen" type="number" value="0" inputmode="numeric">

  <label>Bio-Volldünger – Säcke (Standard 30 €)</label>
  <input id="bio" type="number" value="0" inputmode="numeric">

  <div class="priceGrid">
    <div>
      <label>Rasen Sonderpreis €/Sack (optional)</label>
      <input id="rasenPreis" type="number" step="0.01" inputmode="decimal" placeholder="leer = 45">
      <div class="hint">Leer lassen = 45 €/Sack</div>
    </div>
    <div>
      <label>Bio Sonderpreis €/Sack (optional)</label>
      <input id="bioPreis" type="number" step="0.01" inputmode="decimal" placeholder="leer = 30">
      <div class="hint">Leer lassen = 30 €/Sack</div>
    </div>
  </div>

  <label>Ausgestreut</label>
  <select id="ausgestreut">
    <option>Ja</option>
    <option>Nein</option>
  </select>

  <label>Zahlungsart</label>
  <select id="zahlung">
    <option>Bar</option>
    <option>EC</option>
  </select>

  <button class="blue" onclick="gpsHolen()">📍 GPS holen</button>
  <div class="status" id="gpsStatus">GPS noch nicht ermittelt</div>

  <button class="green" onclick="speichern()">💾 Speichern</button>
  <button class="blue" onclick="neuerEintrag()">➕ Neuer Eintrag</button>

  <button class="gray" onclick="toggleSubmenu()">⚙️ Mehr Optionen</button>
  <div class="submenu" id="submenu">
    <button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
    <button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button>
    <button class="purple" onclick="exportZusammenfassung()">📊 Tageszusammenfassung CSV (Ø Preis)</button>
    <button class="blue" onclick="exportPreisGruppierung()">📊 Preis-Gruppierung CSV (Bar/EC + Summen)</button>
    <button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button>
  </div>
</div>

<div class="card">
  <h2 style="margin:0 0 10px;font-size:18px">📋 Heutige Einträge</h2>

  <div class="tableWrap">
    <table>
      <thead>
        <tr>
          <th>Uhrzeit</th>
          <th>Ort – Name</th>
          <th>Rasen</th>
          <th>Bio</th>
          <th>Zahlung</th>
          <th>€</th>
          <th>Aktion</th>
        </tr>
      </thead>
      <tbody id="tabelleHeute"></tbody>
      <tfoot id="summenHeute"></tfoot>
    </table>
  </div>
</div>

<script>
/* ================= THEME + SUBMENU ================= */
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}
(function(){
  if(localStorage.getItem("theme")==="light") document.body.classList.add("light");
})();
function toggleSubmenu(){
  document.getElementById("submenu").classList.toggle("open");
}

/* ================= HELPERS ================= */
function el(id){ return document.getElementById(id); }
function heuteDatum(){ return new Date().toLocaleDateString("de-DE"); }
function toNum(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }

const STANDARD_RASEN = 45;
const STANDARD_BIO   = 30;

function getPreisRasen(){
  const p = toNum(el("rasenPreis").value);
  return p > 0 ? p : STANDARD_RASEN;
}
function getPreisBio(){
  const p = toNum(el("bioPreis").value);
  return p > 0 ? p : STANDARD_BIO;
}

/* ================= GPS ================= */
function gpsHolen(){
  neuerEintrag();
  el("gpsStatus").innerText="GPS wird ermittelt…";

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
      .then(r=>r.json())
      .then(d=>{
        el("strasse").value=d.address?.road||"";
        el("hausnr").value=d.address?.house_number||"";
        el("plz").value=d.address?.postcode||"";
        el("ort").value=d.address?.city||d.address?.town||d.address?.village||"";
        el("gpsStatus").innerText=`GPS OK: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      });
  }, ()=>alert("GPS nicht verfügbar"));
}

/* ================= SPEICHERN ================= */
function speichern(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]");

  const rasen = toNum(el("rasen").value || 0);
  const bio   = toNum(el("bio").value || 0);

  const rasenPreis = getPreisRasen();
  const bioPreis   = getPreisBio();

  const summe = rasen*rasenPreis + bio*bioPreis;

  const id = el("editId").value || (Date.now()+"_"+Math.random());

  const eintrag = {
    id,
    datum: heuteDatum(),
    uhrzeit: new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
    name: (el("name").value || "").trim() || "(kein Name)",
    telefon: el("telefon").value || "",
    strasse: el("strasse").value || "",
    hausnr: el("hausnr").value || "",
    plz: el("plz").value || "",
    ort: el("ort").value || "",
    rasen, bio,
    rasenPreis, bioPreis,     // Sonderpreise dauerhaft speichern
    ausgestreut: el("ausgestreut").value,
    zahlung: el("zahlung").value,
    summe
  };

  const i = daten.findIndex(e=>e.id===id);
  if(i>=0) daten[i]=eintrag; else daten.push(eintrag);

  localStorage.setItem("humix", JSON.stringify(daten));
  neuerEintrag();
  ladeHeute();
}

/* ================= RESET ================= */
function neuerEintrag(){
  el("editId").value="";
  ["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>el(i).value="");
  el("rasen").value=0;
  el("bio").value=0;
  el("rasenPreis").value="";
  el("bioPreis").value="";
  el("ausgestreut").value="Ja";
  el("zahlung").value="Bar";
  el("gpsStatus").innerText="GPS noch nicht ermittelt";
}

/* ================= HEUTE + SUMMEN ================= */
function ladeHeute(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  const tbody = el("tabelleHeute");
  const tfoot = el("summenHeute");
  tbody.innerHTML="";
  tfoot.innerHTML="";

  let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;

  daten.forEach(e=>{
    const ras = toNum(e.rasen);
    const bi  = toNum(e.bio);
    const su  = toNum(e.summe);

    if(e.zahlung==="Bar"){ bR+=ras; bB+=bi; bS+=su; }
    if(e.zahlung==="EC"){  eR+=ras; eB+=bi; eS+=su; }

    tbody.innerHTML += `
      <tr class="${e.zahlung==="Bar" ? "bar" : "ec"}">
        <td>${e.uhrzeit || ""}</td>
        <td>${(e.ort||"")} – ${(e.name||"")}</td>
        <td>${ras}</td>
        <td>${bi}</td>
        <td>${e.zahlung||""}</td>
        <td>${su.toFixed(2)}</td>
        <td>
          <button class="blue actionBtn" onclick="bearbeiten('${e.id}')">✏️</button>
          <button class="red actionBtn" onclick="loeschen('${e.id}')">🗑</button>
        </td>
      </tr>`;
  });

  tfoot.innerHTML = `
    <tr class="summe bar">
      <td colspan="2">BAR</td><td>${bR}</td><td>${bB}</td><td></td><td>${bS.toFixed(2)}</td><td></td>
    </tr>
    <tr class="summe ec">
      <td colspan="2">EC</td><td>${eR}</td><td>${eB}</td><td></td><td>${eS.toFixed(2)}</td><td></td>
    </tr>
    <tr class="summe">
      <td colspan="2">GESAMT</td><td>${bR+eR}</td><td>${bB+eB}</td><td></td><td>${(bS+eS).toFixed(2)}</td><td></td>
    </tr>`;
}

function bearbeiten(id){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]");
  const e = daten.find(x=>x.id===id);
  if(!e) return;

  el("editId").value = e.id;
  el("name").value = (e.name && e.name !== "(kein Name)") ? e.name : "";
  el("telefon").value = e.telefon || "";
  el("strasse").value = e.strasse || "";
  el("hausnr").value = e.hausnr || "";
  el("plz").value = e.plz || "";
  el("ort").value = e.ort || "";
  el("rasen").value = toNum(e.rasen);
  el("bio").value = toNum(e.bio);
  el("ausgestreut").value = e.ausgestreut || "Ja";
  el("zahlung").value = e.zahlung || "Bar";

  // Sonderpreise wieder laden (nur anzeigen, wenn vom Standard abweichend)
  const rp = toNum(e.rasenPreis) || STANDARD_RASEN;
  const bp = toNum(e.bioPreis)   || STANDARD_BIO;
  el("rasenPreis").value = (rp !== STANDARD_RASEN) ? rp : "";
  el("bioPreis").value   = (bp !== STANDARD_BIO) ? bp : "";
}

function loeschen(id){
  if(!confirm("Eintrag löschen?")) return;
  const daten = JSON.parse(localStorage.getItem("humix") || "[]").filter(e=>e.id!==id);
  localStorage.setItem("humix", JSON.stringify(daten));
  ladeHeute();
}

/* ================= DOWNLOAD CSV (BOM für Umlaute) ================= */
function downloadCSV(text, name){
  const blob = new Blob(["\uFEFF"+text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ================= EXPORT: Tages-CSV ================= */
function exportTagesCSV(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  let csv = "Datum;Uhrzeit;Name;Telefon;Straße;Hausnr;PLZ;Ort;Rasen;RasenPreis;Bio;BioPreis;Ausgestreut;Zahlung;Summe €\n";

  daten.forEach(e=>{
    const tel = String(e.telefon || "").replace(/"/g,'""');
    const rp = toNum(e.rasenPreis) || STANDARD_RASEN;
    const bp = toNum(e.bioPreis)   || STANDARD_BIO;

    csv += `${e.datum};${e.uhrzeit};${e.name||""};="${tel}";${e.strasse||""};${e.hausnr||""};${e.plz||""};${e.ort||""};${toNum(e.rasen)};${rp};${toNum(e.bio)};${bp};${e.ausgestreut||""};${e.zahlung||""};${toNum(e.summe)}\n`;
  });

  const dateName = new Date().toISOString().slice(0,10);
  downloadCSV(csv, `humix_tagesliste_${dateName}.csv`);
}

/* ================= EXPORT: XLSX (heute + Auto-Spaltenbreite) ================= */
function exportXLSX(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  const sheetData = [
    ["Datum","Uhrzeit","Name","Telefon","Straße","Hausnr","PLZ","Ort","Rasen","RasenPreis","Bio","BioPreis","Ausgestreut","Zahlung","Summe €"]
  ];

  daten.forEach(e=>{
    sheetData.push([
      e.datum,
      e.uhrzeit,
      e.name || "",
      e.telefon || "",
      e.strasse || "",
      e.hausnr || "",
      e.plz || "",
      e.ort || "",
      toNum(e.rasen),
      (toNum(e.rasenPreis) || STANDARD_RASEN),
      toNum(e.bio),
      (toNum(e.bioPreis) || STANDARD_BIO),
      e.ausgestreut || "",
      e.zahlung || "",
      toNum(e.summe)
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(sheetData);

  ws["!cols"] = sheetData[0].map((_, i) => ({
    wch: Math.max(...sheetData.map(r => String(r[i] ?? "").length)) + 2
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "HÜMIX");

  const dateName = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `humix_tagesliste_${dateName}.xlsx`);
}

/* ================= EXPORT: Tageszusammenfassung CSV (gewichteter Ø-Preis) ================= */
function exportZusammenfassung(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  const datum = heuteDatum();

  let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;
  let bR_W=0,bB_W=0,eR_W=0,eB_W=0;

  daten.forEach(e=>{
    const ras = toNum(e.rasen);
    const bi  = toNum(e.bio);
    const su  = toNum(e.summe);

    const rp  = toNum(e.rasenPreis) || STANDARD_RASEN;
    const bp  = toNum(e.bioPreis)   || STANDARD_BIO;

    if(e.zahlung==="Bar"){
      bR+=ras; bB+=bi; bS+=su;
      bR_W += ras*rp;
      bB_W += bi*bp;
    }
    if(e.zahlung==="EC"){
      eR+=ras; eB+=bi; eS+=su;
      eR_W += ras*rp;
      eB_W += bi*bp;
    }
  });

  const bR_avg = bR ? (bR_W / bR).toFixed(2) : "0.00";
  const bB_avg = bB ? (bB_W / bB).toFixed(2) : "0.00";
  const eR_avg = eR ? (eR_W / eR).toFixed(2) : "0.00";
  const eB_avg = eB ? (eB_W / eB).toFixed(2) : "0.00";

  let csv = "Datum;Zahlung;Rasen Säcke;Ø Rasen Preis;Bio Säcke;Ø Bio Preis;Summe €\n";
  csv += `${datum};Bar;${bR};${bR_avg};${bB};${bB_avg};${bS.toFixed(2)}\n`;
  csv += `${datum};EC;${eR};${eR_avg};${eB};${eB_avg};${eS.toFixed(2)}\n`;
  csv += `${datum};GESAMT;${bR+eR};;${bB+eB};;${(bS+eS).toFixed(2)}\n`;

  const dateName = new Date().toISOString().slice(0,10);
  downloadCSV(csv, `humix_tageszusammenfassung_${dateName}.csv`);
}

/* ================= EXPORT: Preis-Gruppierung CSV (Bar/EC + Summen) ================= */
function exportPreisGruppierung(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  // Detail-Gruppen: Produkt + Preis + Zahlung
  // key = Produkt|Preis|Zahlung  -> {menge, umsatz}
  const groups = new Map();

  // Summen:
  // pro Produkt+Zahlung (ohne Preis)
  const sumProdPay = new Map(); // key = Produkt|Zahlung
  // pro Produkt gesamt
  const sumProd = new Map();    // key = Produkt
  // pro Zahlung gesamt
  const sumPay = new Map();     // key = Zahlung
  // Gesamt
  let grandMenge = 0;
  let grandUmsatz = 0;

  function add(map, key, menge, umsatz){
    const cur = map.get(key) || {menge:0, umsatz:0};
    cur.menge += menge;
    cur.umsatz += umsatz;
    map.set(key, cur);
  }

  function addDetail(prod, price, pay, qty){
    if(!qty) return;
    const p = Number(price);
    const u = qty * p;

    // Detail
    const key = `${prod}|${p.toFixed(2)}|${pay}`;
    add(groups, key, qty, u);

    // Summen
    add(sumProdPay, `${prod}|${pay}`, qty, u);
    add(sumProd, prod, qty, u);
    add(sumPay, pay, qty, u);

    grandMenge += qty;
    grandUmsatz += u;
  }

  daten.forEach(e=>{
    const pay = e.zahlung || "";
    const ras = toNum(e.rasen);
    const bi  = toNum(e.bio);
    const rp  = toNum(e.rasenPreis) || STANDARD_RASEN;
    const bp  = toNum(e.bioPreis)   || STANDARD_BIO;

    addDetail("Rasen", rp, pay, ras);
    addDetail("Bio",   bp, pay, bi);
  });

  // Detail-Rows sortieren: Produkt, Zahlung, Preis
  const detailRows = Array.from(groups.entries())
    .map(([key, val])=>{
      const [prod, price, pay] = key.split("|");
      return {prod, pay, price: Number(price), menge: val.menge, umsatz: val.umsatz};
    })
    .sort((a,b)=> a.prod.localeCompare(b.prod) || a.pay.localeCompare(b.pay) || a.price - b.price);

  let csv = "Datum;Produkt;Preis;Zahlung;Menge;Umsatz\n";
  const d = heuteDatum();

  detailRows.forEach(r=>{
    csv += `${d};${r.prod};${r.price.toFixed(2)};${r.pay};${r.menge};${r.umsatz.toFixed(2)}\n`;
  });

  // Trennzeile
  csv += ";;;;;\n";

  // Summen pro Produkt+Zahlung
  // sort: Produkt, Zahlung
  const sppRows = Array.from(sumProdPay.entries())
    .map(([key, val])=>{
      const [prod, pay] = key.split("|");
      return {prod, pay, menge: val.menge, umsatz: val.umsatz};
    })
    .sort((a,b)=> a.prod.localeCompare(b.prod) || a.pay.localeCompare(b.pay));

  csv += "SUMME_PRODUKT_ZAHLUNG;;;;;\n";
  csv += "Produkt;;Zahlung;Menge;Umsatz\n";
  sppRows.forEach(r=>{
    csv += `${r.prod};;${r.pay};${r.menge};${r.umsatz.toFixed(2)}\n`;
  });

  csv += ";;;;;\n";

  // Summen pro Produkt
  const spRows = Array.from(sumProd.entries())
    .map(([prod, val])=>({prod, menge: val.menge, umsatz: val.umsatz}))
    .sort((a,b)=> a.prod.localeCompare(b.prod));

  csv += "SUMME_PRODUKT;;;;;\n";
  csv += "Produkt;;;Menge;Umsatz\n";
  spRows.forEach(r=>{
    csv += `${r.prod};;;${r.menge};${r.umsatz.toFixed(2)}\n`;
  });

  csv += ";;;;;\n";

  // Summen pro Zahlung
  const payRows = Array.from(sumPay.entries())
    .map(([pay, val])=>({pay, menge: val.menge, umsatz: val.umsatz}))
    .sort((a,b)=> a.pay.localeCompare(b.pay));

  csv += "SUMME_ZAHLUNG;;;;;\n";
  csv += "Zahlung;;;Menge;Umsatz\n";
  payRows.forEach(r=>{
    csv += `${r.pay};;;${r.menge};${r.umsatz.toFixed(2)}\n`;
  });

  csv += ";;;;;\n";
  csv += `GESAMT;;;${grandMenge};${grandUmsatz.toFixed(2)}\n`;

  const dateName = new Date().toISOString().slice(0,10);
  downloadCSV(csv, `humix_preis_gruppierung_${dateName}.csv`);
}

function allesLoeschen(){
  if(confirm("Wirklich alle Daten löschen?")){
    localStorage.removeItem("humix");
    neuerEintrag();
    ladeHeute();
    alert("Gelöscht");
  }
}

window.onload = ladeHeute;
</script>
