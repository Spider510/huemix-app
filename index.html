<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f4f7f4; margin:0; padding:10px; }
h1 { color:#2e7d32; }
label { font-weight:bold; display:block; margin-top:10px; }
input, select, button {
  width:100%; padding:10px; margin-top:5px;
  font-size:16px; box-sizing:border-box;
}
button { border:none; color:#fff; cursor:pointer; margin-top:10px; }
.green { background:#2e7d32; }
.blue { background:#1976d2; }
.gray { background:#455a64; }
.purple { background:#6a1b9a; }
.orange { background:#ef6c00; }
.red { background:#c62828; }
.status { margin-top:10px; font-size:14px; }
</style>
</head>

<body>

<h1>🌱 HÜMIX Einsatz</h1>

<label>Name</label><input id="name">
<label>Telefon</label><input id="telefon" inputmode="tel">
<label>Straße</label><input id="strasse">
<label>Hausnummer</label><input id="hausnr">
<label>PLZ</label><input id="plz">
<label>Ort</label><input id="ort">

<label>Rasen kg</label><input id="rasenKg" type="number" value="20">
<label>Rasen Preis €</label><input id="rasenPreis" type="number" value="45">
<label>Rasen Säcke</label><input id="rasen" type="number" value="0">

<label>Bio Liter</label><input id="bioL" type="number" value="65">
<label>Bio Preis €</label><input id="bioPreis" type="number" value="30">
<label>Bio Säcke</label><input id="bio" type="number" value="0">

<label>Ausgestreut</label>
<select id="ausgestreut"><option>Ja</option><option>Nein</option></select>

<label>Zahlungsart</label>
<select id="zahlung"><option>Bar</option><option>EC</option></select>

<button class="blue" onclick="gpsHolen()">📍 GPS neu holen</button>
<div class="status" id="gpsStatus">GPS noch nicht ermittelt</div>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="blue" onclick="felderLeeren()">➕ Neuer Eintrag</button>

<button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
<button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button>
<button class="purple" onclick="exportZusammenfassung()">📊 Tageszusammenfassung CSV</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button>

<div class="status" id="status">Bereit.</div>

<script>
const STD_RASEN_KG=20, STD_RASEN_PREIS=45, STD_BIO_L=65, STD_BIO_PREIS=30;

function speichern(){
  const d=JSON.parse(localStorage.getItem("humix")||"[]");
  const r=+rasen.value||0,b=+bio.value||0;
  const rp=+rasenPreis.value||45,bp=+bioPreis.value||30;
  const now=new Date();
  d.push({
    datum:now.toLocaleDateString("de-DE"),
    uhrzeit:now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
    name:name.value,telefon:telefon.value,strasse:strasse.value,
    hausnr:hausnr.value,plz:plz.value,ort:ort.value,
    rasen:r,bio:b,rasenKg:+rasenKg.value,bioL:+bioL.value,
    rasenPreis:rp,bioPreis:bp,
    ausgestreut:ausgestreut.value,zahlung:zahlung.value,
    summe:r*rp+b*bp
  });
  localStorage.setItem("humix",JSON.stringify(d));
  felderLeeren();
  rasenKg.value=STD_RASEN_KG; bioL.value=STD_BIO_L;
  rasenPreis.value=STD_RASEN_PREIS; bioPreis.value=STD_BIO_PREIS;
}

function felderLeeren(){
  ["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>document.getElementById(i).value="");
  rasen.value=0; bio.value=0;
}

/* ✅ HIER IST DIE REPARATUR */
function exportZusammenfassung(){
  const d=JSON.parse(localStorage.getItem("humix")||"[]");
  if(!d.length) return alert("Keine Daten");
  const datum=d[0].datum;
  let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;
  d.forEach(x=>{
    if(x.zahlung==="Bar"){bR+=x.rasen;bB+=x.bio;bS+=x.summe;}
    if(x.zahlung==="EC"){eR+=x.rasen;eB+=x.bio;eS+=x.summe;}
  });
  let csv="Datum;Standard Rasen kg;Rasen Preis €;Standard Bio L;Bio Preis €;Zahlung;Rasen Säcke;Bio Säcke;Summe €\n";
  csv+=`${datum};20;45;65;30;Bar;${bR};${bB};${bS}\n`;
  csv+=`${datum};20;45;65;30;EC;${eR};${eB};${eS}\n`;
  csv+=`${datum};20;45;65;30;GESAMT;${bR+eR};${bB+eB};${bS+eS}`;
  downloadCSV(csv,"humix_tageszusammenfassung.csv");
}

function downloadCSV(t,n){
  const b=new Blob(["\uFEFF"+t],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=n; a.click();
}
function allesLoeschen(){ if(confirm("Wirklich löschen?")) localStorage.removeItem("humix"); }
</script>
</body>
</html>
