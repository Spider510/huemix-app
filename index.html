<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#111c2f;
  --border:#22314f;
  --text:#eef2ff;
  --muted:#a7b0c6;

  --green:#2e7d32;
  --blue:#1976d2;
  --gray:#455a64;
  --purple:#6a1b9a;
  --orange:#ef6c00;
  --red:#c62828;
}
body.light{
  --bg:#f4f7f4;
  --card:#ffffff;
  --border:#d7dde6;
  --text:#162033;
  --muted:#506079;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  color:var(--text);
  padding:12px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
h1{margin:0;font-size:20px}
.themeBtn{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-top:12px;
}
label{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin-top:10px;
  display:block;
}
input,select,button{
  width:100%;
  padding:14px;
  margin-top:6px;
  border-radius:12px;
  font-size:16px;
}
input,select{
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
}
button{border:none;color:#fff;font-weight:700}
.green{background:var(--green)}
.blue{background:var(--blue)}
.gray{background:var(--gray)}
.purple{background:var(--purple)}
.orange{background:var(--orange)}
.red{background:var(--red)}
.submenu{max-height:0;overflow:hidden;transition:.3s}
.submenu.open{max-height:1000px}
.tableWrap{overflow:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:8px;border-bottom:1px solid var(--border)}
.summe{font-weight:bold}
.bar{background:rgba(46,125,50,.12)}
.ec{background:rgba(25,118,210,.12)}
.actionBtn{width:auto;padding:6px 10px;font-size:13px}
.priceGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.priceGrid{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="topbar">
<h1>🌱 HÜMIX Einsatz</h1>
<button class="themeBtn" onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="card">

<input type="hidden" id="editId">

<label>Name</label><input id="name">
<label>Telefon</label><input id="telefon">
<label>Straße</label><input id="strasse">
<label>Hausnummer</label><input id="hausnr">
<label>PLZ</label><input id="plz">
<label>Ort</label><input id="ort">

<label>Rasen Säcke (45€)</label>
<input id="rasen" type="number" value="0">

<label>Bio Säcke (30€)</label>
<input id="bio" type="number" value="0">

<div class="priceGrid">
<div>
<label>Rasen Sonderpreis €/Sack</label>
<input id="rasenPreis" type="number" step="0.01" placeholder="leer = 45">
</div>
<div>
<label>Bio Sonderpreis €/Sack</label>
<input id="bioPreis" type="number" step="0.01" placeholder="leer = 30">
</div>
</div>

<label>Ausgestreut</label>
<select id="ausgestreut"><option>Ja</option><option>Nein</option></select>

<label>Zahlungsart</label>
<select id="zahlung"><option>Bar</option><option>EC</option></select>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="blue" onclick="neuerEintrag()">➕ Neuer Eintrag</button>

<button class="gray" onclick="toggleSubmenu()">☰ Export / Löschen</button>
<div class="submenu" id="submenu">
<button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
<button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button>
<button class="purple" onclick="exportZusammenfassung()">📊 Tageszusammenfassung CSV</button>
<button class="blue" onclick="exportPreisGruppierung()">📊 Preis-Gruppierung CSV</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button>
</div>

</div>

<div class="card">
<h2>📋 Heutige Einträge</h2>
<div class="tableWrap">
<table>
<thead>
<tr>
<th>Uhrzeit</th>
<th>Ort – Name</th>
<th>Rasen</th>
<th>Bio</th>
<th>Zahlung</th>
<th>€</th>
<th>Aktion</th>
</tr>
</thead>
<tbody id="tabelleHeute"></tbody>
<tfoot id="summenHeute"></tfoot>
</table>
</div>
</div>

<script>
const STANDARD_RASEN=45;
const STANDARD_BIO=30;

function el(id){return document.getElementById(id);}
function heuteDatum(){return new Date().toLocaleDateString("de-DE");}
function toNum(v){const n=Number(v);return Number.isFinite(n)?n:0;}

function toggleTheme(){
document.body.classList.toggle("light");
localStorage.setItem("theme",document.body.classList.contains("light"));
}
if(localStorage.getItem("theme")==="true")document.body.classList.add("light");

function toggleSubmenu(){
el("submenu").classList.toggle("open");
}

function speichern(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]");

const rasen=toNum(el("rasen").value);
const bio=toNum(el("bio").value);
const rp=toNum(el("rasenPreis").value)||STANDARD_RASEN;
const bp=toNum(el("bioPreis").value)||STANDARD_BIO;

const summe=rasen*rp+bio*bp;

const id=el("editId").value||Date.now();

const eintrag={
id,
datum:heuteDatum(),
uhrzeit:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
name:el("name").value||"",
ort:el("ort").value||"",
rasen,bio,
rasenPreis:rp,
bioPreis:bp,
zahlung:el("zahlung").value,
summe
};

const i=daten.findIndex(e=>e.id===id);
if(i>=0)daten[i]=eintrag;else daten.push(eintrag);

localStorage.setItem("humix",JSON.stringify(daten));
neuerEintrag();
ladeHeute();
}

function neuerEintrag(){
el("editId").value="";
["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>{if(el(i))el(i).value="";});
el("rasen").value=0;
el("bio").value=0;
el("rasenPreis").value="";
el("bioPreis").value="";
}

function ladeHeute(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.datum===heuteDatum());

let tbody=el("tabelleHeute");
let tfoot=el("summenHeute");
tbody.innerHTML="";
tfoot.innerHTML="";

let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;

daten.forEach(e=>{
if(e.zahlung==="Bar"){bR+=e.rasen;bB+=e.bio;bS+=e.summe;}
if(e.zahlung==="EC"){eR+=e.rasen;eB+=e.bio;eS+=e.summe;}

tbody.innerHTML+=`
<tr class="${e.zahlung==="Bar"?"bar":"ec"}">
<td>${e.uhrzeit}</td>
<td>${e.ort} – ${e.name}</td>
<td>${e.rasen}</td>
<td>${e.bio}</td>
<td>${e.zahlung}</td>
<td>${e.summe.toFixed(2)}</td>
<td><button class="red actionBtn" onclick="loeschen(${e.id})">🗑</button></td>
</tr>`;
});

tfoot.innerHTML=`
<tr class="summe"><td colspan="2">BAR</td><td>${bR}</td><td>${bB}</td><td></td><td>${bS.toFixed(2)}</td><td></td></tr>
<tr class="summe"><td colspan="2">EC</td><td>${eR}</td><td>${eB}</td><td></td><td>${eS.toFixed(2)}</td><td></td></tr>
<tr class="summe"><td colspan="2">GESAMT</td><td>${bR+eR}</td><td>${bB+eB}</td><td></td><td>${(bS+eS).toFixed(2)}</td><td></td></tr>`;
}

function loeschen(id){
let daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.id!==id);
localStorage.setItem("humix",JSON.stringify(daten));
ladeHeute();
}

function allesLoeschen(){
localStorage.removeItem("humix");
ladeHeute();
}

function downloadCSV(text,name){
const blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=name;
a.click();
}

/* Preis Gruppierung – Komma-Trennung + Punkt Dezimal */
function exportPreisGruppierung(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.datum===heuteDatum());
if(!daten.length)return alert("Keine Daten");

let csv="DETAIL – PREISSTUFEN\n";
csv+="Datum,Produkt,Preis,Bar Säcke,EC Säcke,Gesamt Säcke,Bar Umsatz,EC Umsatz,Gesamt Umsatz\n";

let barGes=0,ecGes=0,rasBar=0,rasEC=0,bioBar=0,bioEC=0;

daten.forEach(e=>{
const rp=e.rasenPreis||45;
const bp=e.bioPreis||30;

if(e.rasen){
let u=e.rasen*rp;
csv+=`${e.datum},Rasen,${rp.toFixed(2)},${e.zahlung==="Bar"?e.rasen:0},${e.zahlung==="EC"?e.rasen:0},${e.rasen},${e.zahlung==="Bar"?u.toFixed(2):0},${e.zahlung==="EC"?u.toFixed(2):0},${u.toFixed(2)}\n`;
if(e.zahlung==="Bar"){barGes+=u;rasBar+=e.rasen;}
if(e.zahlung==="EC"){ecGes+=u;rasEC+=e.rasen;}
}
if(e.bio){
let u=e.bio*bp;
csv+=`${e.datum},Bio,${bp.toFixed(2)},${e.zahlung==="Bar"?e.bio:0},${e.zahlung==="EC"?e.bio:0},${e.bio},${e.zahlung==="Bar"?u.toFixed(2):0},${e.zahlung==="EC"?u.toFixed(2):0},${u.toFixed(2)}\n`;
if(e.zahlung==="Bar"){barGes+=u;bioBar+=e.bio;}
if(e.zahlung==="EC"){ecGes+=u;bioEC+=e.bio;}
}
});

csv+="\nPRODUKTSUMMEN – MENGEN\n";
csv+="Produkt,Bar Säcke,EC Säcke,Gesamt Säcke\n";
csv+=`Rasen,${rasBar},${rasEC},${rasBar+rasEC}\n`;
csv+=`Bio,${bioBar},${bioEC},${bioBar+bioEC}\n`;

csv+="\nZAHLUNGSÜBERSICHT – UMSATZ\n";
csv+="Kategorie,Bar,EC,Gesamt\n";
csv+=`Umsatz €,${barGes.toFixed(2)},${ecGes.toFixed(2)},${(barGes+ecGes).toFixed(2)}\n`;

downloadCSV(csv,"humix_preis_gruppierung.csv");
}

window.onload=ladeHeute;
</script>

</body>
</html>
