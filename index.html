<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f4f7f4; margin:0; padding:10px; }
h1,h2 { color:#2e7d32; }
label { font-weight:bold; display:block; margin-top:10px; }
input, select, button {
  width:100%; padding:10px; margin-top:5px;
  font-size:16px; box-sizing:border-box;
}
button { border:none; color:#fff; cursor:pointer; margin-top:10px; }
.green { background:#2e7d32; }
.blue { background:#1976d2; }
.gray { background:#455a64; }
.purple { background:#6a1b9a; }
.orange { background:#ef6c00; }
.red { background:#c62828; }

table { width:100%; border-collapse:collapse; margin-top:15px; background:#fff; }
th,td { border:1px solid #ccc; padding:6px; font-size:14px; }
th { background:#e8f5e9; }
.bar { background:#e8f5e9; }
.ec { background:#e3f2fd; }
.actionBtn { padding:4px 6px; font-size:12px; }
.status { font-size:14px; margin-top:6px; }
</style>
</head>

<body>

<h1>🌱 HÜMIX Einsatz</h1>

<input type="hidden" id="editId">

<label>Name</label>
<input id="name" placeholder="optional">

<label>Telefon</label>
<input id="telefon" inputmode="tel">

<label>Straße</label>
<input id="strasse">

<label>Hausnummer</label>
<input id="hausnr">

<label>PLZ</label>
<input id="plz">

<label>Ort</label>
<input id="ort">

<label>Rasen Spezial – Säcke (45 €)</label>
<input id="rasen" type="number" value="0">

<label>Bio-Volldünger – Säcke (30 €)</label>
<input id="bio" type="number" value="0">

<label>Ausgestreut</label>
<select id="ausgestreut">
  <option>Ja</option>
  <option>Nein</option>
</select>

<label>Zahlungsart</label>
<select id="zahlung">
  <option>Bar</option>
  <option>EC</option>
</select>

<button class="blue" onclick="gpsHolen()">📍 GPS holen</button>
<div class="status" id="gpsStatus">GPS noch nicht ermittelt</div>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="blue" onclick="neuerEintrag()">➕ Neuer Eintrag</button>

<button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
<button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button>
<button class="purple" onclick="exportZusammenfassung()">📊 Tageszusammenfassung CSV</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button>

<h2>📋 Heutige Einträge</h2>

<table>
<thead>
<tr>
<th>Uhrzeit</th>
<th>Ort – Name</th>
<th>Rasen</th>
<th>Bio</th>
<th>Zahlung</th>
<th>€</th>
<th>Aktion</th>
</tr>
</thead>
<tbody id="tabelleHeute"></tbody>
</table>

<script>
function el(id){ return document.getElementById(id); }
function heuteDatum(){ return new Date().toLocaleDateString("de-DE"); }

/* ================= GPS ================= */
function gpsHolen(){
  neuerEintrag();
  el("gpsStatus").innerText = "GPS wird ermittelt…";

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
      .then(r=>r.json())
      .then(d=>{
        el("strasse").value = d.address?.road || "";
        el("hausnr").value  = d.address?.house_number || "";
        el("plz").value     = d.address?.postcode || "";
        el("ort").value     = d.address?.city || d.address?.town || d.address?.village || "";
        el("gpsStatus").innerText = "GPS OK";
      });
  }, ()=>{
    el("gpsStatus").innerText = "GPS nicht verfügbar";
  });
}

/* ================= SPEICHERN ================= */
function speichern(){
  try{
    const daten = JSON.parse(localStorage.getItem("humix") || "[]");

    const nameVal = el("name").value.trim() || "(kein Name)";
    const rasenVal = Number(el("rasen").value || 0);
    const bioVal = Number(el("bio").value || 0);
    const summe = rasenVal * 45 + bioVal * 30;

    const id = el("editId").value || Date.now()+"_"+Math.random().toString(16).slice(2);

    const eintrag = {
      id,
      datum: heuteDatum(),
      uhrzeit: new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
      name: nameVal,
      telefon: el("telefon").value || "",
      strasse: el("strasse").value || "",
      hausnr: el("hausnr").value || "",
      plz: el("plz").value || "",
      ort: el("ort").value || "",
      rasen: rasenVal,
      bio: bioVal,
      ausgestreut: el("ausgestreut").value,
      zahlung: el("zahlung").value,
      summe
    };

    const idx = daten.findIndex(e=>e.id===id);
    if(idx>=0) daten[idx]=eintrag;
    else daten.push(eintrag);

    localStorage.setItem("humix",JSON.stringify(daten));
    neuerEintrag();
    ladeHeute();

  }catch(e){
    alert("Speichern fehlgeschlagen:\n"+e.message);
  }
}

/* ================= NEUER EINTRAG ================= */
function neuerEintrag(){
  el("editId").value="";
  ["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>el(i).value="");
  el("rasen").value=0;
  el("bio").value=0;
  el("gpsStatus").innerText="GPS noch nicht ermittelt";
}

/* ================= TABELLE ================= */
function ladeHeute(){
  const daten = JSON.parse(localStorage.getItem("humix")||"[]")
    .filter(e=>e.datum===heuteDatum())
    .sort((a,b)=>a.ort.localeCompare(b.ort)||a.uhrzeit.localeCompare(b.uhrzeit));

  const tbody = el("tabelleHeute");
  tbody.innerHTML="";

  daten.forEach(e=>{
    tbody.innerHTML+=`
      <tr class="${e.zahlung==="Bar"?"bar":"ec"}">
        <td>${e.uhrzeit}</td>
        <td>${e.ort} – ${e.name}</td>
        <td>${e.rasen}</td>
        <td>${e.bio}</td>
        <td>${e.zahlung}</td>
        <td>${e.summe}</td>
        <td>
          <button class="blue actionBtn" onclick="bearbeiten('${e.id}')">✏️</button>
          <button class="red actionBtn" onclick="loeschen('${e.id}')">🗑</button>
        </td>
      </tr>`;
  });
}

function bearbeiten(id){
  const e = JSON.parse(localStorage.getItem("humix")).find(x=>x.id===id);
  el("editId").value=e.id;
  Object.keys(e).forEach(k=>{ if(el(k)) el(k).value=e[k]; });
}

function loeschen(id){
  if(!confirm("Eintrag löschen?")) return;
  const daten = JSON.parse(localStorage.getItem("humix")).filter(e=>e.id!==id);
  localStorage.setItem("humix",JSON.stringify(daten));
  ladeHeute();
}

/* ================= EXPORTS ================= */
function exportTagesCSV(){
  const daten=JSON.parse(localStorage.getItem("humix")||"[]");
  if(!daten.length) return alert("Keine Daten");
  let csv="Datum;Uhrzeit;Name;Telefon;Straße;Hausnr;PLZ;Ort;Rasen;Bio;Ausgestreut;Zahlung;Summe €\n";
  daten.forEach(e=>{
    const tel=String(e.telefon||"").replace(/"/g,'""');
    csv+=`${e.datum};${e.uhrzeit};${e.name};="${tel}";${e.strasse};${e.hausnr};${e.plz};${e.ort};${e.rasen};${e.bio};${e.ausgestreut};${e.zahlung};${e.summe}\n`;
  });
  downloadCSV(csv,"humix_tagesliste.csv");
}

function exportXLSX(){
  const daten=JSON.parse(localStorage.getItem("humix")||"[]");
  if(!daten.length) return alert("Keine Daten");

  const sheet=[["Datum","Uhrzeit","Name","Telefon","Straße","Hausnr","PLZ","Ort","Rasen","Bio","Ausgestreut","Zahlung","Summe €"]];
  daten.forEach(e=>{
    sheet.push([e.datum,e.uhrzeit,e.name,e.telefon,e.strasse,e.hausnr,e.plz,e.ort,e.rasen,e.bio,e.ausgestreut,e.zahlung,e.summe]);
  });

  const ws=XLSX.utils.aoa_to_sheet(sheet);
  ws["!cols"]=sheet[0].map((_,i)=>({wch:Math.max(...sheet.map(r=>String(r[i]||"").length))+2}));

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"HÜMIX");
  XLSX.writeFile(wb,"humix_tagesliste.xlsx");
}

/* ================= ZUSAMMENFASSUNG CSV ================= */
/* ✅ NUR HIER geändert: NaN verhindern (alte/kaputte Einträge sauber auf 0 setzen) */
function exportZusammenfassung(){
  const daten=JSON.parse(localStorage.getItem("humix")||"[]");
  if(!daten.length) return alert("Keine Daten");

  const toNum = (v)=>{
    // erlaubt "16", 16, "", null, undefined, "16,5" etc.
    if (v === null || v === undefined || v === "") return 0;
    const n = Number(String(v).replace(",", "."));
    return Number.isFinite(n) ? n : 0;
  };

  let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;

  daten.forEach(e=>{
    const rasen = toNum(e.rasen);
    const bio   = toNum(e.bio);
    const summe = toNum(e.summe);

    if(e.zahlung==="Bar"){ bR+=rasen; bB+=bio; bS+=summe; }
    if(e.zahlung==="EC"){  eR+=rasen; eB+=bio; eS+=summe; }
  });

  const d = daten[0].datum || heuteDatum();

  let csv="Datum;Zahlung;Rasen Säcke;Bio Säcke;Summe €\n";
  csv+=`${d};Bar;${bR};${bB};${bS}\n`;
  csv+=`${d};EC;${eR};${eB};${eS}\n`;
  csv+=`${d};GESAMT;${bR+eR};${bB+eB};${bS+eS}`;

  downloadCSV(csv,"humix_tageszusammenfassung.csv");
}

/* ================= DOWNLOAD CSV ================= */
function downloadCSV(text,name){
  const blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
}

function allesLoeschen(){
  if(confirm("Wirklich alle Daten löschen?")){
    localStorage.removeItem("humix");
    ladeHeute();
  }
}

window.onload=ladeHeute;
</script>

</body>
</html>
