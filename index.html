<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --border:#334155;
  --text:#f1f5f9;
  --muted:#94a3b8;
}
body.light{
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#1e293b;
  --muted:#64748b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  color:var(--text);
  padding:12px;
  font-size:16px;
}
h1{margin:0;font-size:20px}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.themeToggle{
  padding:8px 12px;
  border-radius:18px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:14px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}
label{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:4px;
  display:block;
}
input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  font-size:16px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:16px;
  font-size:16px;
  font-weight:600;
  border:none;
  border-radius:14px;
  margin-top:8px;
  color:#fff;
}
.green{background:#2e7d32}
.blue{background:#1976d2}
.gray{background:#455a64}
.purple{background:#6a1b9a}
.orange{background:#ef6c00}
.red{background:#c62828}
.status{
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
}

/* SUBMENU */
.submenu{
  overflow:hidden;
  max-height:0;
  transition:max-height .3s ease;
}
.submenu.open{
  max-height:500px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:8px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
.bar{background:rgba(46,125,50,.15)}
.ec{background:rgba(25,118,210,.15)}
.summe{font-weight:bold}
.actionBtn{
  padding:8px;
  font-size:14px;
  border-radius:10px;
  width:auto;
}
</style>
</head>

<body>

<div class="topbar">
<h1>🌱 HÜMIX Einsatz</h1>
<button class="themeToggle" onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="card">
<input type="hidden" id="editId">

<label>Name</label>
<input id="name">

<label>Telefon</label>
<input id="telefon" inputmode="tel">

<label>Straße</label>
<input id="strasse">

<label>Hausnummer</label>
<input id="hausnr">

<label>PLZ</label>
<input id="plz" inputmode="numeric">

<label>Ort</label>
<input id="ort">

<label>Rasen Spezial – Säcke (45 €)</label>
<input id="rasen" type="number" value="0">

<label>Bio-Volldünger – Säcke (30 €)</label>
<input id="bio" type="number" value="0">

<label>Ausgestreut</label>
<select id="ausgestreut">
<option>Ja</option>
<option>Nein</option>
</select>

<label>Zahlungsart</label>
<select id="zahlung">
<option>Bar</option>
<option>EC</option>
</select>

<button class="blue" onclick="gpsHolen()">📍 GPS holen</button>
<div class="status" id="gpsStatus">GPS noch nicht ermittelt</div>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="blue" onclick="neuerEintrag()">➕ Neuer Eintrag</button>

<button class="gray" onclick="toggleSubmenu()">⚙️ Mehr Optionen</button>

<div class="submenu" id="submenu">
<button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
<button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button>
<button class="purple" onclick="exportZusammenfassung()">📊 Tageszusammenfassung</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle löschen</button>
</div>

</div>

<div class="card">
<h2 style="margin-top:0;font-size:18px">📋 Heutige Einträge</h2>
<table>
<thead>
<tr>
<th>Uhr</th>
<th>Ort – Name</th>
<th>R</th>
<th>B</th>
<th>Z</th>
<th>€</th>
<th></th>
</tr>
</thead>
<tbody id="tabelleHeute"></tbody>
<tfoot id="summenHeute"></tfoot>
</table>
</div>

<script>
function toggleTheme(){
document.body.classList.toggle("light");
localStorage.setItem("theme",
document.body.classList.contains("light")?"light":"dark");
}
(function(){
if(localStorage.getItem("theme")==="light")
document.body.classList.add("light");
})();

function toggleSubmenu(){
document.getElementById("submenu").classList.toggle("open");
}

/* ======== ORIGINAL FUNKTIONEN ======== */
function el(id){ return document.getElementById(id); }
function heuteDatum(){ return new Date().toLocaleDateString("de-DE"); }
function toNum(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }

/* GPS */
function gpsHolen(){
neuerEintrag();
el("gpsStatus").innerText="GPS wird ermittelt…";
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude;
const lon=pos.coords.longitude;
fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
.then(r=>r.json())
.then(d=>{
el("strasse").value=d.address?.road||"";
el("hausnr").value=d.address?.house_number||"";
el("plz").value=d.address?.postcode||"";
el("ort").value=d.address?.city||d.address?.town||d.address?.village||"";
el("gpsStatus").innerText="GPS OK";
});
},()=>alert("GPS nicht verfügbar"));
}

/* SPEICHERN */
function speichern(){
const daten = JSON.parse(localStorage.getItem("humix")||"[]");
const rasen=toNum(el("rasen").value||0);
const bio=toNum(el("bio").value||0);
const summe=rasen*45+bio*30;
const id=el("editId").value||(Date.now()+"_"+Math.random());
const eintrag={
id,datum:heuteDatum(),
uhrzeit:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
name:(el("name").value||"").trim()||"(kein Name)",
telefon:el("telefon").value||"",
strasse:el("strasse").value||"",
hausnr:el("hausnr").value||"",
plz:el("plz").value||"",
ort:el("ort").value||"",
rasen,bio,
ausgestreut:el("ausgestreut").value,
zahlung:el("zahlung").value,
summe};
const i=daten.findIndex(e=>e.id===id);
if(i>=0)daten[i]=eintrag;else daten.push(eintrag);
localStorage.setItem("humix",JSON.stringify(daten));
neuerEintrag();
ladeHeute();
}

/* Rest unverändert */
function neuerEintrag(){
el("editId").value="";
["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>el(i).value="");
el("rasen").value=0;
el("bio").value=0;
el("gpsStatus").innerText="GPS noch nicht ermittelt";
}

function ladeHeute(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.datum===heuteDatum());
const tbody=el("tabelleHeute");
const tfoot=el("summenHeute");
tbody.innerHTML="";
tfoot.innerHTML="";
let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;
daten.forEach(e=>{
const ras=toNum(e.rasen),bi=toNum(e.bio),su=toNum(e.summe);
if(e.zahlung==="Bar"){bR+=ras;bB+=bi;bS+=su;}
if(e.zahlung==="EC"){eR+=ras;eB+=bi;eS+=su;}
tbody.innerHTML+=`
<tr class="${e.zahlung==="Bar"?"bar":"ec"}">
<td>${e.uhrzeit||""}</td>
<td>${(e.ort||"")} – ${(e.name||"")}</td>
<td>${ras}</td>
<td>${bi}</td>
<td>${e.zahlung||""}</td>
<td>${su}</td>
<td>
<button class="blue actionBtn" onclick="bearbeiten('${e.id}')">✏️</button>
<button class="red actionBtn" onclick="loeschen('${e.id}')">🗑</button>
</td></tr>`;});
tfoot.innerHTML=`
<tr class="summe bar"><td colspan="2">BAR</td><td>${bR}</td><td>${bB}</td><td></td><td>${bS}</td><td></td></tr>
<tr class="summe ec"><td colspan="2">EC</td><td>${eR}</td><td>${eB}</td><td></td><td>${eS}</td><td></td></tr>
<tr class="summe"><td colspan="2">GESAMT</td><td>${bR+eR}</td><td>${bB+eB}</td><td></td><td>${bS+eS}</td><td></td></tr>`;
}

function bearbeiten(id){
const daten=JSON.parse(localStorage.getItem("humix")||"[]");
const e=daten.find(x=>x.id===id);
if(!e)return;
el("editId").value=e.id;
el("name").value=(e.name&&e.name!=="(kein Name)")?e.name:"";
el("telefon").value=e.telefon||"";
el("strasse").value=e.strasse||"";
el("hausnr").value=e.hausnr||"";
el("plz").value=e.plz||"";
el("ort").value=e.ort||"";
el("rasen").value=toNum(e.rasen);
el("bio").value=toNum(e.bio);
el("ausgestreut").value=e.ausgestreut||"Ja";
el("zahlung").value=e.zahlung||"Bar";
}

function loeschen(id){
if(!confirm("Eintrag löschen?"))return;
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.id!==id);
localStorage.setItem("humix",JSON.stringify(daten));
ladeHeute();
}

function allesLoeschen(){
if(confirm("Wirklich alle Daten löschen?")){
localStorage.removeItem("humix");
neuerEintrag();
ladeHeute();
alert("Gelöscht");
}
}

window.onload=ladeHeute;
</script>

</body>
</html>
