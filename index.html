<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<!-- SheetJS für XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* ===== Modernes Smartphone-Layout (Funktionen bleiben unverändert) ===== */
:root{
  --bg:#0f172a;
  --card:#111c2f;
  --card2:#0b1426;
  --border:#22314f;
  --text:#eef2ff;
  --muted:#a7b0c6;

  --green:#2e7d32;
  --blue:#1976d2;
  --gray:#455a64;
  --purple:#6a1b9a;
  --orange:#ef6c00;
  --red:#c62828;
}

body.light{
  --bg:#f4f7f4;
  --card:#ffffff;
  --card2:#ffffff;
  --border:#d7dde6;
  --text:#162033;
  --muted:#506079;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  padding:12px;
  font-size:16px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
h1{ margin:0; font-size:20px; }

.themeBtn{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:14px;
  cursor:pointer;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.10);
}

h2{
  margin:0 0 10px 0;
  font-size:18px;
}

label{
  font-weight:650;
  font-size:13px;
  color:var(--muted);
  display:block;
  margin-top:10px;
}
input, select, button{
  width:100%;
  padding:14px;
  margin-top:6px;
  font-size:16px; /* iOS Zoom verhindern */
  border-radius:12px;
}
input, select{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
}
button{
  border:none;
  color:#fff;
  cursor:pointer;
  font-weight:750;
}

.green { background:var(--green); }
.blue  { background:var(--blue); }
.gray  { background:var(--gray); }
.purple{ background:var(--purple); }
.orange{ background:var(--orange); }
.red   { background:var(--red); }

.status{
  font-size:14px;
  margin-top:8px;
  color:var(--muted);
}

/* Sonderpreis-Grid */
.priceGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media (max-width:420px){
  .priceGrid{ grid-template-columns:1fr; }
}
.hint{
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
}

/* Untermenü */
.submenu{
  overflow:hidden;
  max-height:0;
  transition:max-height .25s ease;
  margin-top:8px;
}
.submenu.open{ max-height:1600px; }

/* Tabelle */
.tableWrap{
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card2);
}
table{
  width:100%;
  border-collapse:collapse;
  min-width: 920px; /* Handy: horizontal scroll */
}
th,td{
  border-bottom:1px solid var(--border);
  padding:10px;
  font-size:14px;
  white-space:nowrap;
}
th{
  position:sticky;
  top:0;
  background:var(--card);
  z-index:1;
}
.bar { background:rgba(46,125,50,.12); }
.ec  { background:rgba(25,118,210,.12); }
.summe { font-weight:800; }

.actionBtn{
  padding:8px 10px;
  font-size:13px;
  width:auto;
  border-radius:10px;
  margin-right:6px;
}
</style>
</head>

<body>

<div class="topbar">
  <h1>🌱 HÜMIX Einsatz</h1>
  <button class="themeBtn" onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="card">
  <input type="hidden" id="editId">

  <label>Name</label>
  <input id="name" placeholder="optional">

  <label>Telefon</label>
  <input id="telefon" inputmode="tel">

  <label>Straße</label>
  <input id="strasse">

  <label>Hausnummer</label>
  <input id="hausnr">

  <label>PLZ</label>
  <input id="plz" inputmode="numeric">

  <label>Ort</label>
  <input id="ort">

  <label>Rasen Spezial – Säcke (Standard 45 €)</label>
  <input id="rasen" type="number" value="0" inputmode="numeric">

  <label>Bio-Volldünger – Säcke (Standard 30 €)</label>
  <input id="bio" type="number" value="0" inputmode="numeric">

  <!-- Sonderpreise (pro Eintrag gespeichert) -->
  <div class="priceGrid">
    <div>
      <label>Rasen Sonderpreis €/Sack (optional)</label>
      <input id="rasenPreis" type="number" step="0.01" inputmode="decimal" placeholder="leer = 45">
      <div class="hint">Leer lassen = 45 €/Sack</div>
    </div>
    <div>
      <label>Bio Sonderpreis €/Sack (optional)</label>
      <input id="bioPreis" type="number" step="0.01" inputmode="decimal" placeholder="leer = 30">
      <div class="hint">Leer lassen = 30 €/Sack</div>
    </div>
  </div>

  <label>Ausgestreut</label>
  <select id="ausgestreut">
    <option>Ja</option>
    <option>Nein</option>
  </select>

  <label>Zahlungsart</label>
  <select id="zahlung">
    <option>Bar</option>
    <option>EC</option>
  </select>

  <button class="blue" onclick="gpsHolen()">📍 GPS holen</button>
  <div class="status" id="gpsStatus">GPS noch nicht ermittelt</div>

  <button class="green" onclick="speichern()">💾 Speichern</button>
  <button class="blue" onclick="neuerEintrag()">➕ Neuer Eintrag</button>

  <button class="gray" onclick="toggleSubmenu()">☰ Export / Löschen</button>
  <div class="submenu" id="submenu">
    <button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
    <button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button>
    <button class="purple" onclick="exportZusammenfassung()">📊 Tageszusammenfassung CSV</button>

    <button class="blue" onclick="previewPreisGruppierung()">📄 Preis-Gruppierung Vorschau</button>
    <button class="orange" onclick="exportPreisGruppierungXLSX()">📊 Preis-Gruppierung XLSX</button>

    <button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button>
  </div>
</div>

<div class="card">
  <h2>📋 Heutige Einträge</h2>

  <div class="tableWrap">
    <table>
      <thead>
      <tr>
        <th>Uhrzeit</th>
        <th>Ort – Name</th>
        <th>Rasen</th>
        <th>Bio</th>
        <th>Zahlung</th>
        <th>€</th>
        <th>Aktion</th>
      </tr>
      </thead>
      <tbody id="tabelleHeute"></tbody>
      <tfoot id="summenHeute"></tfoot>
    </table>
  </div>
</div>

<script>
/* ================= UI (Theme + Menü) ================= */
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("humix_theme", document.body.classList.contains("light") ? "light" : "dark");
}
(function(){
  if(localStorage.getItem("humix_theme")==="light") document.body.classList.add("light");
})();
function toggleSubmenu(){
  document.getElementById("submenu").classList.toggle("open");
}

/* ================= Helfer ================= */
function el(id){ return document.getElementById(id); }
function heuteDatum(){ return new Date().toLocaleDateString("de-DE"); }
function toNum(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
function fmtEUR(n){
  return (Number(n||0)).toLocaleString("de-DE",{minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
}

const STANDARD_RASEN = 45;
const STANDARD_BIO   = 30;

function getPreisRasen(){
  const p = toNum(el("rasenPreis").value);
  return p > 0 ? p : STANDARD_RASEN;
}
function getPreisBio(){
  const p = toNum(el("bioPreis").value);
  return p > 0 ? p : STANDARD_BIO;
}

/* ================= GPS + Reverse Geocoding ================= */
function gpsHolen(){
  neuerEintrag();
  el("gpsStatus").innerText="GPS wird ermittelt…";

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
      .then(r=>r.json())
      .then(d=>{
        el("strasse").value=d.address?.road||"";
        el("hausnr").value=d.address?.house_number||"";
        el("plz").value=d.address?.postcode||"";
        el("ort").value=d.address?.city||d.address?.town||d.address?.village||"";
        el("gpsStatus").innerText=`GPS OK: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      })
      .catch(()=>{
        el("gpsStatus").innerText=`GPS OK: ${lat.toFixed(5)}, ${lon.toFixed(5)} (Adresse nicht geladen)`;
      });
  }, ()=>alert("GPS nicht verfügbar"));
}

/* ================= SPEICHERN (mit Edit-ID) ================= */
function speichern(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]");

  const rasen = toNum(el("rasen").value || 0);
  const bio   = toNum(el("bio").value || 0);

  const rasenPreis = getPreisRasen();
  const bioPreis   = getPreisBio();

  const summe = rasen*rasenPreis + bio*bioPreis;

  const id = el("editId").value || (Date.now()+"_"+Math.random());

  const eintrag = {
    id,
    datum: heuteDatum(),
    uhrzeit: new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
    name: (el("name").value || "").trim() || "(kein Name)",
    telefon: el("telefon").value || "",
    strasse: el("strasse").value || "",
    hausnr: el("hausnr").value || "",
    plz: el("plz").value || "",
    ort: el("ort").value || "",
    rasen, bio,
    rasenPreis, bioPreis,               // Sonderpreise pro Eintrag
    ausgestreut: el("ausgestreut").value,
    zahlung: el("zahlung").value,
    summe
  };

  const i = daten.findIndex(e=>e.id===id);
  if(i>=0) daten[i]=eintrag; else daten.push(eintrag);

  localStorage.setItem("humix", JSON.stringify(daten));
  neuerEintrag();
  ladeHeute();
}

/* ================= RESET ================= */
function neuerEintrag(){
  el("editId").value="";
  ["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>el(i).value="");
  el("rasen").value=0;
  el("bio").value=0;
  el("rasenPreis").value="";
  el("bioPreis").value="";
  el("ausgestreut").value="Ja";
  el("zahlung").value="Bar";
  el("gpsStatus").innerText="GPS noch nicht ermittelt";
}

/* ================= HEUTE + SUMMEN ================= */
function ladeHeute(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  const tbody = el("tabelleHeute");
  const tfoot = el("summenHeute");
  tbody.innerHTML="";
  tfoot.innerHTML="";

  let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;

  daten.forEach(e=>{
    const ras = toNum(e.rasen);
    const bi  = toNum(e.bio);
    const su  = toNum(e.summe);

    if(e.zahlung==="Bar"){ bR+=ras; bB+=bi; bS+=su; }
    if(e.zahlung==="EC"){  eR+=ras; eB+=bi; eS+=su; }

    tbody.innerHTML += `
      <tr class="${e.zahlung==="Bar" ? "bar" : "ec"}">
        <td>${e.uhrzeit || ""}</td>
        <td>${(e.ort||"")} – ${(e.name||"")}</td>
        <td>${ras}</td>
        <td>${bi}</td>
        <td>${e.zahlung||""}</td>
        <td>${su.toFixed(2)}</td>
        <td>
          <button class="blue actionBtn" onclick="bearbeiten('${e.id}')">✏️</button>
          <button class="red actionBtn" onclick="loeschen('${e.id}')">🗑</button>
        </td>
      </tr>`;
  });

  tfoot.innerHTML = `
    <tr class="summe bar">
      <td colspan="2">BAR</td><td>${bR}</td><td>${bB}</td><td></td><td>${bS.toFixed(2)}</td><td></td>
    </tr>
    <tr class="summe ec">
      <td colspan="2">EC</td><td>${eR}</td><td>${eB}</td><td></td><td>${eS.toFixed(2)}</td><td></td>
    </tr>
    <tr class="summe">
      <td colspan="2">GESAMT</td><td>${bR+eR}</td><td>${bB+eB}</td><td></td><td>${(bS+eS).toFixed(2)}</td><td></td>
    </tr>`;
}

function bearbeiten(id){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]");
  const e = daten.find(x=>x.id===id);
  if(!e) return;

  el("editId").value = e.id;
  el("name").value = (e.name && e.name !== "(kein Name)") ? e.name : "";
  el("telefon").value = e.telefon || "";
  el("strasse").value = e.strasse || "";
  el("hausnr").value = e.hausnr || "";
  el("plz").value = e.plz || "";
  el("ort").value = e.ort || "";
  el("rasen").value = toNum(e.rasen);
  el("bio").value = toNum(e.bio);
  el("ausgestreut").value = e.ausgestreut || "Ja";
  el("zahlung").value = e.zahlung || "Bar";

  const rp = toNum(e.rasenPreis) || STANDARD_RASEN;
  const bp = toNum(e.bioPreis)   || STANDARD_BIO;
  el("rasenPreis").value = (rp !== STANDARD_RASEN) ? rp : "";
  el("bioPreis").value   = (bp !== STANDARD_BIO) ? bp : "";
}

function loeschen(id){
  if(!confirm("Eintrag löschen?")) return;
  const daten = JSON.parse(localStorage.getItem("humix") || "[]").filter(e=>e.id!==id);
  localStorage.setItem("humix", JSON.stringify(daten));
  ladeHeute();
}

/* ================= DOWNLOAD CSV (BOM für Umlaute) ================= */
function downloadCSV(text, name){
  const blob = new Blob(["\uFEFF"+text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ================= EXPORT: Tages-CSV ================= */
function exportTagesCSV(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  let csv = "Datum;Uhrzeit;Name;Telefon;Straße;Hausnr;PLZ;Ort;Rasen;RasenPreis;Bio;BioPreis;Ausgestreut;Zahlung;Summe €\n";

  daten.forEach(e=>{
    const tel = String(e.telefon || "").replace(/"/g,'""'); // Excel-freundlich
    const rp = toNum(e.rasenPreis) || STANDARD_RASEN;
    const bp = toNum(e.bioPreis)   || STANDARD_BIO;

    csv += `${e.datum};${e.uhrzeit};${e.name||""};="${tel}";${e.strasse||""};${e.hausnr||""};${e.plz||""};${e.ort||""};${toNum(e.rasen)};${rp};${toNum(e.bio)};${bp};${e.ausgestreut||""};${e.zahlung||""};${toNum(e.summe)}\n`;
  });

  const dateName = new Date().toISOString().slice(0,10); // yyyy-mm-dd
  downloadCSV(csv, `humix_tagesliste_${dateName}.csv`);
}

/* ================= EXPORT: XLSX (heute + Auto-Spaltenbreite) ================= */
function exportXLSX(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  const sheetData = [
    ["Datum","Uhrzeit","Name","Telefon","Straße","Hausnr","PLZ","Ort","Rasen","RasenPreis","Bio","BioPreis","Ausgestreut","Zahlung","Summe €"]
  ];

  daten.forEach(e=>{
    sheetData.push([
      e.datum,
      e.uhrzeit,
      e.name || "",
      e.telefon || "",
      e.strasse || "",
      e.hausnr || "",
      e.plz || "",
      e.ort || "",
      toNum(e.rasen),
      (toNum(e.rasenPreis) || STANDARD_RASEN),
      toNum(e.bio),
      (toNum(e.bioPreis) || STANDARD_BIO),
      e.ausgestreut || "",
      e.zahlung || "",
      toNum(e.summe)
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(sheetData);

  // Auto-Spaltenbreite
  ws["!cols"] = sheetData[0].map((_, i) => ({
    wch: Math.max(...sheetData.map(r => String(r[i] ?? "").length)) + 2
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "HÜMIX");

  const dateName = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `humix_tagesliste_${dateName}.xlsx`);
}

/* ================= EXPORT: Tageszusammenfassung CSV (gewichteter Ø-Preis) ================= */
function exportZusammenfassung(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  if(!daten.length) return alert("Keine Daten für heute");

  const datum = heuteDatum();
  let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;
  let bR_W=0,bB_W=0,eR_W=0,eB_W=0;

  daten.forEach(e=>{
    const ras = toNum(e.rasen);
    const bi  = toNum(e.bio);
    const su  = toNum(e.summe);
    const rp  = toNum(e.rasenPreis) || STANDARD_RASEN;
    const bp  = toNum(e.bioPreis)   || STANDARD_BIO;

    if(e.zahlung==="Bar"){
      bR+=ras; bB+=bi; bS+=su;
      bR_W += ras*rp;
      bB_W += bi*bp;
    }
    if(e.zahlung==="EC"){
      eR+=ras; eB+=bi; eS+=su;
      eR_W += ras*rp;
      eB_W += bi*bp;
    }
  });

  const bR_avg = bR ? (bR_W / bR).toFixed(2) : "0.00";
  const bB_avg = bB ? (bB_W / bB).toFixed(2) : "0.00";
  const eR_avg = eR ? (eR_W / eR).toFixed(2) : "0.00";
  const eB_avg = eB ? (eB_W / eB).toFixed(2) : "0.00";

  let csv = "Datum;Zahlung;Rasen Säcke;Ø Rasen Preis;Bio Säcke;Ø Bio Preis;Summe €\n";
  csv += `${datum};Bar;${bR};${bR_avg};${bB};${bB_avg};${bS.toFixed(2)}\n`;
  csv += `${datum};EC;${eR};${eR_avg};${eB};${eB_avg};${eS.toFixed(2)}\n`;
  csv += `${datum};GESAMT;${bR+eR};;${bB+eB};;${(bS+eS).toFixed(2)}\n`;

  const dateName = new Date().toISOString().slice(0,10);
  downloadCSV(csv, `humix_tageszusammenfassung_${dateName}.csv`);
}

/* ================= Preis-Gruppierung Daten (gemeinsam für Vorschau & XLSX) ================= */
function buildPreisGruppierung(){
  const daten = JSON.parse(localStorage.getItem("humix") || "[]")
    .filter(e=>e.datum===heuteDatum());

  const datum = heuteDatum();

  // key = Produkt|Preis (Preis auf 2 Stellen)
  const groups = new Map(); // -> {prod, preis, barM, ecM, barU, ecU}
  let rasBar=0, rasEC=0, bioBar=0, bioEC=0;
  let barGes=0, ecGes=0;

  function add(prod, preis, zahlung, menge){
    menge = toNum(menge);
    if(!menge) return;

    const p = Number(preis)||0;
    const u = menge*p;

    const key = `${prod}|${p.toFixed(2)}`;
    if(!groups.has(key)){
      groups.set(key, {prod, preis:p, barM:0, ecM:0, barU:0, ecU:0});
    }
    const g = groups.get(key);

    if(zahlung==="Bar"){
      g.barM += menge;
      g.barU += u;
      barGes += u;
      if(prod==="Rasen") rasBar += menge;
      if(prod==="Bio")   bioBar += menge;
    } else if(zahlung==="EC"){
      g.ecM += menge;
      g.ecU += u;
      ecGes += u;
      if(prod==="Rasen") rasEC += menge;
      if(prod==="Bio")   bioEC += menge;
    }
  }

  daten.forEach(e=>{
    const pay = e.zahlung || "";
    add("Rasen", (toNum(e.rasenPreis) || STANDARD_RASEN), pay, e.rasen);
    add("Bio",   (toNum(e.bioPreis)   || STANDARD_BIO),   pay, e.bio);
  });

  const orderProd = p => (p==="Rasen" ? 0 : 1);

  const detail = Array.from(groups.values())
    .sort((a,b)=> orderProd(a.prod)-orderProd(b.prod) || a.preis-b.preis)
    .map(g=>{
      const gesM = g.barM + g.ecM;
      const gesU = g.barU + g.ecU;
      return {
        datum,
        prod: g.prod,
        preis: g.preis,
        barM: g.barM,
        ecM: g.ecM,
        gesM,
        barU: g.barU,
        ecU: g.ecU,
        gesU
      };
    });

  return {
    datum,
    detail,
    rasBar, rasEC, bioBar, bioEC,
    barGes, ecGes,
    gesGes: barGes + ecGes,
    datenCount: daten.length
  };
}

/* ================= Preis-Gruppierung Vorschau (druckbar) ================= */
function previewPreisGruppierung(){
  const pack = buildPreisGruppierung();
  if(!pack.datenCount) return alert("Keine Daten für heute");

  const rows = pack.detail.map(r=>`
    <tr>
      <td>${r.datum}</td>
      <td>${r.prod}</td>
      <td style="text-align:right">${fmtEUR(r.preis)}</td>
      <td style="text-align:right">${r.barM}</td>

/* ================= Preis-Gruppierung XLSX (saubere Vorschau/Excel) ================= */
function exportPreisGruppierungXLSX(){
  const pack = buildPreisGruppierung();
  if(!pack.datenCount) return alert("Keine Daten für heute");

  const sheet = [];

  sheet.push(["DETAIL – PREISSTUFEN"]);
  sheet.push(["Datum","Produkt","Preis","Bar Säcke","EC Säcke","Gesamt Säcke","Bar Umsatz","EC Umsatz","Gesamt Umsatz"]);

  pack.detail.forEach(r=>{
    sheet.push([r.datum, r.prod, r.preis, r.barM, r.ecM, r.gesM, r.barU, r.ecU, r.gesU]);
  });

  sheet.push([]);
  sheet.push(["PRODUKTSUMMEN – MENGEN"]);
  sheet.push(["Produkt","Bar Säcke","EC Säcke","Gesamt Säcke"]);
  sheet.push(["Rasen", pack.rasBar, pack.rasEC, pack.rasBar+pack.rasEC]);
  sheet.push(["Bio",   pack.bioBar, pack.bioEC, pack.bioBar+pack.bioEC]);

  sheet.push([]);
  sheet.push(["ZAHLUNGSÜBERSICHT – UMSATZ"]);
  sheet.push(["Kategorie","Bar","EC","Gesamt"]);
  sheet.push(["Umsatz €", pack.barGes, pack.ecGes, pack.gesGes]);

  const ws = XLSX.utils.aoa_to_sheet(sheet);

  // Spaltenbreite
  ws["!cols"] = sheet[1].map((_, i) => ({
    wch: Math.max(...sheet.map(r => String(r[i] ?? "").length)) + 2
  }));

  // Zahlenformat: Preis/Umätze als € (so weit möglich)
  // Spalten: Preis (C), Bar Umsatz (G), EC Umsatz (H), Gesamt Umsatz (I)
  const moneyCols = [2,6,7,8];
  for(let R=3; R<=2+pack.detail.length; R++){
    moneyCols.forEach(C=>{
      const addr = XLSX.utils.encode_cell({r:R-1, c:C});
      if(ws[addr] && typeof ws[addr].v === "number"){
        ws[addr].z = '#,##0.00" €"';
      }
    });
  }

  // Zahlungsübersicht (letzte Zeile) – Geldformat
  // Wir suchen die Zeile "Umsatz €"
  for(let r=0; r<sheet.length; r++){
    if(sheet[r] && sheet[r][0]==="Umsatz €"){
      const base = r; // 0-index
      [1,2,3].forEach(c=>{
        const addr = XLSX.utils.encode_cell({r:base, c});
        if(ws[addr] && typeof ws[addr].v === "number"){
          ws[addr].z = '#,##0.00" €"';
        }
      });
      break;
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Preis Gruppierung");

  const dateName = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `humix_preis_gruppierung_${dateName}.xlsx`);
}
