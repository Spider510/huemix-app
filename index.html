<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#111c2f;
  --border:#22314f;
  --text:#eef2ff;
  --muted:#a7b0c6;
}
body.light{
  --bg:#f4f7f4;
  --card:#ffffff;
  --border:#d7dde6;
  --text:#162033;
  --muted:#506079;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  padding:12px;
  font-size:16px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
h1{margin:0;font-size:20px}
.themeBtn{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}
label{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin-top:10px;
  display:block;
}
input,select,button{
  width:100%;
  padding:14px;
  margin-top:6px;
  border-radius:12px;
  font-size:16px;
}
input,select{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
}
button{
  border:none;
  color:#fff;
  font-weight:700;
}
.green{background:#2e7d32}
.blue{background:#1976d2}
.gray{background:#455a64}
.purple{background:#6a1b9a}
.orange{background:#ef6c00}
.red{background:#c62828}
.submenu{max-height:0;overflow:hidden;transition:.3s}
.submenu.open{max-height:1000px}
table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}
th,td{
  padding:8px;
  border-bottom:1px solid var(--border);
}
.bar{background:rgba(46,125,50,.12)}
.ec{background:rgba(25,118,210,.12)}
.summe{font-weight:bold}
.actionBtn{width:auto;padding:6px 10px;font-size:13px}
.status{font-size:13px;margin-top:6px;color:var(--muted)}
.priceGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.priceGrid{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="topbar">
<h1>🌱 HÜMIX Einsatz</h1>
<button class="themeBtn" onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="card">
<input type="hidden" id="editId">

<label>Name</label>
<input id="name">

<label>Telefon</label>
<input id="telefon">

<label>Straße</label>
<input id="strasse">

<label>Hausnummer</label>
<input id="hausnr">

<label>PLZ</label>
<input id="plz">

<label>Ort</label>
<input id="ort">

<label>Rasen Säcke (45€)</label>
<input id="rasen" type="number" value="0">

<label>Bio Säcke (30€)</label>
<input id="bio" type="number" value="0">

<div class="priceGrid">
<div>
<label>Rasen Sonderpreis €/Sack</label>
<input id="rasenPreis" type="number" step="0.01" placeholder="leer = 45">
</div>
<div>
<label>Bio Sonderpreis €/Sack</label>
<input id="bioPreis" type="number" step="0.01" placeholder="leer = 30">
</div>
</div>

<label>Ausgestreut</label>
<select id="ausgestreut">
<option>Ja</option>
<option>Nein</option>
</select>

<label>Zahlungsart</label>
<select id="zahlung">
<option>Bar</option>
<option>EC</option>
</select>

<button class="blue" onclick="gpsHolen()">📍 GPS holen</button>
<div class="status" id="gpsStatus">GPS noch nicht ermittelt</div>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="blue" onclick="neuerEintrag()">➕ Neuer Eintrag</button>

<button class="gray" onclick="toggleSubmenu()">☰ Export / Löschen</button>
<div class="submenu" id="submenu">
<button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
<button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button>
<button class="purple" onclick="exportZusammenfassung()">📊 Tageszusammenfassung CSV</button>
<button class="blue" onclick="exportPreisGruppierung()">📊 Preis-Gruppierung CSV</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle löschen</button>
</div>
</div>

<div class="card">
<h2>📋 Heutige Einträge</h2>
<div style="overflow:auto">
<table>
<thead>
<tr>
<th>Uhrzeit</th>
<th>Ort – Name</th>
<th>Rasen</th>
<th>Bio</th>
<th>Zahlung</th>
<th>€</th>
<th>Aktion</th>
</tr>
</thead>
<tbody id="tabelleHeute"></tbody>
<tfoot id="summenHeute"></tfoot>
</table>
</div>
</div>

<script>
const STANDARD_RASEN=45;
const STANDARD_BIO=30;

function el(id){return document.getElementById(id);}
function heuteDatum(){return new Date().toLocaleDateString("de-DE");}
function toNum(v){const n=Number(v);return Number.isFinite(n)?n:0;}
function toggleTheme(){document.body.classList.toggle("light");}
function toggleSubmenu(){el("submenu").classList.toggle("open");}

function preisRasen(){return toNum(el("rasenPreis").value)||STANDARD_RASEN;}
function preisBio(){return toNum(el("bioPreis").value)||STANDARD_BIO;}

function speichern(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]");
const rasen=toNum(el("rasen").value);
const bio=toNum(el("bio").value);
const rp=preisRasen();
const bp=preisBio();
const summe=rasen*rp+bio*bp;

const id=el("editId").value||Date.now()+"_"+Math.random();

const eintrag={
id,
datum:heuteDatum(),
uhrzeit:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
name:el("name").value||"(kein Name)",
telefon:el("telefon").value||"",
strasse:el("strasse").value||"",
hausnr:el("hausnr").value||"",
plz:el("plz").value||"",
ort:el("ort").value||"",
rasen,bio,
rasenPreis:rp,
bioPreis:bp,
ausgestreut:el("ausgestreut").value,
zahlung:el("zahlung").value,
summe
};

const i=daten.findIndex(e=>e.id===id);
if(i>=0)daten[i]=eintrag;else daten.push(eintrag);

localStorage.setItem("humix",JSON.stringify(daten));
neuerEintrag();
ladeHeute();
}

function neuerEintrag(){
el("editId").value="";
["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>el(i).value="");
el("rasen").value=0;
el("bio").value=0;
el("rasenPreis").value="";
el("bioPreis").value="";
}

function ladeHeute(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.datum===heuteDatum());

let bS=0,eS=0;
el("tabelleHeute").innerHTML="";

daten.forEach(e=>{
if(e.zahlung==="Bar")bS+=e.summe;
if(e.zahlung==="EC")eS+=e.summe;

el("tabelleHeute").innerHTML+=`
<tr>
<td>${e.uhrzeit}</td>
<td>${e.ort} – ${e.name}</td>
<td>${e.rasen}</td>
<td>${e.bio}</td>
<td>${e.zahlung}</td>
<td>${e.summe.toFixed(2)}</td>
<td><button class="red actionBtn" onclick="loeschen('${e.id}')">🗑</button></td>
</tr>`;
});

el("summenHeute").innerHTML=`
<tr class="summe"><td colspan="5">BAR</td><td>${bS.toFixed(2)}</td><td></td></tr>
<tr class="summe"><td colspan="5">EC</td><td>${eS.toFixed(2)}</td><td></td></tr>
<tr class="summe"><td colspan="5">GESAMT</td><td>${(bS+eS).toFixed(2)}</td><td></td></tr>`;
}

function loeschen(id){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.id!==id);
localStorage.setItem("humix",JSON.stringify(daten));
ladeHeute();
}

function allesLoeschen(){
if(confirm("Wirklich löschen?")){
localStorage.removeItem("humix");
ladeHeute();
}
}

function downloadCSV(text,name){
const blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=name;
a.click();
}

/* ===== PREIS GRUPPIERUNG MIT BAR/EC SPALTEN ===== */
function exportPreisGruppierung(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.datum===heuteDatum());
if(!daten.length)return alert("Keine Daten");

const groups=new Map();

let rasenGes=0;
let bioGes=0;
let barGes=0;
let ecGes=0;
let gesamt=0;

daten.forEach(e=>{
[
{prod:"Rasen",menge:e.rasen,preis:e.rasenPreis},
{prod:"Bio",menge:e.bio,preis:e.bioPreis}
].forEach(x=>{
if(!x.menge)return;

const key=`${x.prod}|${x.preis}`;
const cur=groups.get(key)||{barM:0,ecM:0,barU:0,ecU:0};

if(e.zahlung==="Bar"){
cur.barM+=x.menge;
cur.barU+=x.menge*x.preis;
barGes+=x.menge*x.preis;
}
if(e.zahlung==="EC"){
cur.ecM+=x.menge;
cur.ecU+=x.menge*x.preis;
ecGes+=x.menge*x.preis;
}

groups.set(key,cur);

if(x.prod==="Rasen")rasenGes+=x.menge;
if(x.prod==="Bio")bioGes+=x.menge;

gesamt+=x.menge*x.preis;
});
});

let csv="Datum;Produkt;Preis;Bar Säcke;EC Säcke;Bar Umsatz;EC Umsatz;Gesamt Säcke;Gesamt Umsatz\n";

groups.forEach((val,key)=>{
const [prod,preis]=key.split("|");
const gesM=val.barM+val.ecM;
const gesU=val.barU+val.ecU;
csv+=`${heuteDatum()};${prod};${Number(preis).toFixed(2)};${val.barM};${val.ecM};${val.barU.toFixed(2)};${val.ecU.toFixed(2)};${gesM};${gesU.toFixed(2)}\n`;
});

csv+=";;;;;;;;\nGESAMTSUMMEN;;;;;;;;\n";
csv+=`Anzahl Rasen gesamt;;;;;;;${rasenGes}\n`;
csv+=`Anzahl Bio gesamt;;;;;;;${bioGes}\n\n`;
csv+=`Geld Bar gesamt;;;;;${barGes.toFixed(2)};;\n`;
csv+=`Geld EC gesamt;;;;;;${ecGes.toFixed(2)};\n\n`;
csv+=`Geld gesamt;;;;;;;;${gesamt.toFixed(2)}\n`;

downloadCSV(csv,"humix_preis_gruppierung.csv");
}

window.onload=ladeHeute;
</script>

</body>
</html>
