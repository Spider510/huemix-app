<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --border:#334155;
  --text:#f1f5f9;
  --muted:#94a3b8;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  color:var(--text);
  padding:12px;
  font-size:16px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}
label{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}
input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  font-size:16px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:16px;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:14px;
  margin-top:8px;
  color:#fff;
}
.green{background:#2e7d32}
.blue{background:#1976d2}
.gray{background:#455a64}
.orange{background:#ef6c00}
.purple{background:#6a1b9a}
.red{background:#c62828}
.submenu{max-height:0;overflow:hidden;transition:.3s}
.submenu.open{max-height:600px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left}
.bar{background:rgba(46,125,50,.15)}
.ec{background:rgba(25,118,210,.15)}
.summe{font-weight:bold}
.actionBtn{padding:6px 8px;font-size:12px;width:auto}
.status{font-size:13px;margin:6px 0 10px}
</style>
</head>

<body>

<div class="card">
<h2>🌱 HÜMIX Einsatz</h2>
<input type="hidden" id="editId">

<label>Name</label>
<input id="name">

<label>Rasen Säcke</label>
<input id="rasen" type="number" value="0">

<label>Rasen Sonderpreis €/Sack</label>
<input id="rasenPreis" type="number" step="0.01" placeholder="Standard 45">

<label>Bio Säcke</label>
<input id="bio" type="number" value="0">

<label>Bio Sonderpreis €/Sack</label>
<input id="bioPreis" type="number" step="0.01" placeholder="Standard 30">

<label>Zahlungsart</label>
<select id="zahlung">
<option>Bar</option>
<option>EC</option>
</select>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="gray" onclick="toggleSubmenu()">⚙️ Mehr</button>

<div class="submenu" id="submenu">
<button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
<button class="orange" onclick="exportXLSX()">📊 Excel</button>
<button class="purple" onclick="exportZusammenfassung()">📊 Ø Preis Zusammenfassung</button>
<button class="blue" onclick="exportPreisGruppierung()">📊 Preis-Gruppierung</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle löschen</button>
</div>
</div>

<div class="card">
<h3>📋 Heute</h3>
<table>
<thead>
<tr>
<th>R</th>
<th>B</th>
<th>Z</th>
<th>€</th>
<th></th>
</tr>
</thead>
<tbody id="tabelleHeute"></tbody>
<tfoot id="summenHeute"></tfoot>
</table>
</div>

<script>
const STANDARD_RASEN=45;
const STANDARD_BIO=30;

function el(id){return document.getElementById(id);}
function heuteDatum(){return new Date().toLocaleDateString("de-DE");}
function toNum(v){const n=Number(v);return Number.isFinite(n)?n:0;}

function toggleSubmenu(){
el("submenu").classList.toggle("open");
}

function speichern(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]");

const rasen=toNum(el("rasen").value);
const bio=toNum(el("bio").value);
const rp=toNum(el("rasenPreis").value)||STANDARD_RASEN;
const bp=toNum(el("bioPreis").value)||STANDARD_BIO;

const summe=rasen*rp+bio*bp;

const eintrag={
id:Date.now()+"_"+Math.random(),
datum:heuteDatum(),
rasen,bio,
rasenPreis:rp,
bioPreis:bp,
zahlung:el("zahlung").value,
summe
};

daten.push(eintrag);
localStorage.setItem("humix",JSON.stringify(daten));
ladeHeute();
neuerEintrag();
}

function neuerEintrag(){
el("rasen").value=0;
el("bio").value=0;
el("rasenPreis").value="";
el("bioPreis").value="";
}

function ladeHeute(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.datum===heuteDatum());

const tbody=el("tabelleHeute");
const tfoot=el("summenHeute");
tbody.innerHTML="";
tfoot.innerHTML="";

let ges=0;
daten.forEach(e=>{
ges+=e.summe;
tbody.innerHTML+=`
<tr class="${e.zahlung==="Bar"?"bar":"ec"}">
<td>${e.rasen}</td>
<td>${e.bio}</td>
<td>${e.zahlung}</td>
<td>${e.summe.toFixed(2)}</td>
<td><button class="red actionBtn" onclick="loeschen('${e.id}')">🗑</button></td>
</tr>`;
});

tfoot.innerHTML=`
<tr class="summe">
<td colspan="3">Gesamt</td>
<td>${ges.toFixed(2)}</td>
<td></td>
</tr>`;
}

function loeschen(id){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.id!==id);
localStorage.setItem("humix",JSON.stringify(daten));
ladeHeute();
}

function allesLoeschen(){
if(confirm("Wirklich löschen?")){
localStorage.removeItem("humix");
ladeHeute();
}
}

/* CSV Download */
function downloadCSV(text,name){
const blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=name;
a.click();
}

/* Ø Preis Zusammenfassung */
function exportZusammenfassung(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.datum===heuteDatum());
if(!daten.length)return alert("Keine Daten");

let totalR=0,totalB=0,totalSum=0;
let rWert=0,bWert=0;

daten.forEach(e=>{
totalR+=e.rasen;
totalB+=e.bio;
totalSum+=e.summe;
rWert+=e.rasen*e.rasenPreis;
bWert+=e.bio*e.bioPreis;
});

const rAvg=totalR?(rWert/totalR).toFixed(2):0;
const bAvg=totalB?(bWert/totalB).toFixed(2):0;

let csv="Datum;Rasen;Ø Rasen Preis;Bio;Ø Bio Preis;Summe\n";
csv+=`${heuteDatum()};${totalR};${rAvg};${totalB};${bAvg};${totalSum.toFixed(2)}\n`;

downloadCSV(csv,"humix_Ø_preise.csv");
}

/* Preis Gruppierung */
function exportPreisGruppierung(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.datum===heuteDatum());
if(!daten.length)return alert("Keine Daten");

let gruppen={};

daten.forEach(e=>{
if(e.rasen>0){
gruppen["Rasen_"+e.rasenPreis]=(gruppen["Rasen_"+e.rasenPreis]||0)+e.rasen;
}
if(e.bio>0){
gruppen["Bio_"+e.bioPreis]=(gruppen["Bio_"+e.bioPreis]||0)+e.bio;
}
});

let csv="Produkt;Preis;Menge\n";

for(let key in gruppen){
let teile=key.split("_");
csv+=`${teile[0]};${teile[1]};${gruppen[key]}\n`;
}

downloadCSV(csv,"humix_preis_gruppierung.csv");
}

/* XLSX */
function exportXLSX(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]")
.filter(e=>e.datum===heuteDatum());
if(!daten.length)return alert("Keine Daten");

const ws=XLSX.utils.json_to_sheet(daten);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"HÜMIX");
XLSX.writeFile(wb,"humix.xlsx");
}

window.onload=ladeHeute;
</script>

</body>
</html>
