<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#f2f4f8;
  margin:0;
  padding:12px;
}
h1{
  text-align:center;
  color:#2e7d32;
}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:16px;
}
button{
  border:none;
  color:#fff;
  margin-top:8px;
}
.green{background:#2e7d32;}
.blue{background:#1976d2;}
.gray{background:#455a64;}
.purple{background:#6a1b9a;}
.red{background:#c62828;}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:14px;
}
th,td{
  padding:6px;
  border-bottom:1px solid #eee;
  text-align:center;
}
th{background:#f5f5f5;}
.bar{background:#e8f5e9;}
.ec{background:#e3f2fd;}
.smallbtn{
  padding:4px 8px;
  font-size:13px;
  border-radius:6px;
}
</style>
</head>

<body>

<h1>🌱 HÜMIX Einsatz</h1>

<div class="card">
<input id="name" placeholder="Name">
<input id="telefon" placeholder="Telefon">
<input id="strasse" placeholder="Straße">
<input id="hausnr" placeholder="Hausnr">
<input id="plz" placeholder="PLZ">
<input id="ort" placeholder="Ort">
<input id="rasen" type="number" value="0" placeholder="Rasen Säcke">
<input id="bio" type="number" value="0" placeholder="Bio Säcke">

<select id="ausgestreut">
<option>Ja</option>
<option>Nein</option>
</select>

<select id="zahlung">
<option>Bar</option>
<option>EC</option>
</select>

<button class="blue" onclick="gpsHolen()">📍 GPS Adresse holen</button>
<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="blue" onclick="neu()">➕ Neuer Eintrag</button>
</div>

<div class="card">
<button class="gray" onclick="exportTagesCSV()">📄 Tages CSV</button>
<button class="purple" onclick="exportZusammenfassung()">📊 Tages-Zusammenfassung CSV</button>
<button class="gray" onclick="exportKundenCSV()">👥 Kunden CSV</button>
<button class="gray" onclick="exportKundenXLS()">📊 Kunden XLS</button>
</div>

<div class="card">
<h3>📋 Heutige Einträge</h3>
<div id="heute"></div>
</div>

<div class="card">
<h3>👥 Kundenliste</h3>
<div id="kunden"></div>
</div>

<script>

let editIndex=null;

function heuteDatum(){
  return new Date().toLocaleDateString("de-DE");
}

function neu(){
  editIndex=null;
  ["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>document.getElementById(i).value="");
  document.getElementById("rasen").value=0;
  document.getElementById("bio").value=0;
}

function speichern(){
  const daten=JSON.parse(localStorage.getItem("humix")||"[]");

  const rasen=parseInt(document.getElementById("rasen").value)||0;
  const bio=parseInt(document.getElementById("bio").value)||0;
  const summe=rasen*45+bio*30;

  const eintrag={
    datum:heuteDatum(),
    uhr:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
    name:document.getElementById("name").value||"",
    telefon:document.getElementById("telefon").value||"",
    strasse:document.getElementById("strasse").value||"",
    hausnr:document.getElementById("hausnr").value||"",
    plz:document.getElementById("plz").value||"",
    ort:document.getElementById("ort").value||"",
    rasen,
    bio,
    zahlung:document.getElementById("zahlung").value,
    summe
  };

  if(editIndex!==null){
    daten[editIndex]=eintrag;
  }else{
    daten.push(eintrag);
  }

  localStorage.setItem("humix",JSON.stringify(daten));
  neu();
  anzeigen();
}

function gpsHolen(){
navigator.geolocation.getCurrentPosition(pos=>{
fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
.then(r=>r.json())
.then(d=>{
document.getElementById("strasse").value=d.address.road||"";
document.getElementById("hausnr").value=d.address.house_number||"";
document.getElementById("plz").value=d.address.postcode||"";
document.getElementById("ort").value=d.address.city||d.address.town||d.address.village||"";
});
});
}

function anzeigen(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]");

const heute=daten.filter(d=>d.datum===heuteDatum());

let html="<table><tr><th>Uhr</th><th>Ort-Name</th><th>Rasen</th><th>Bio</th><th>€</th><th></th><th></th></tr>";

let barR=0,barB=0,barS=0,ecR=0,ecB=0,ecS=0;

heute.forEach((e,i)=>{
let cls=e.zahlung==="Bar"?"bar":"ec";
let name=e.name||"(kein Name)";
html+=`<tr class="${cls}">
<td>${e.uhr}</td>
<td>${e.ort} - ${name}</td>
<td>${e.rasen}</td>
<td>${e.bio}</td>
<td>${e.summe}</td>
<td><button class="smallbtn blue" onclick="bearbeiten(${i})">✏️</button></td>
<td><button class="smallbtn red" onclick="loeschen(${i})">🗑</button></td>
</tr>`;

if(e.zahlung==="Bar"){barR+=e.rasen;barB+=e.bio;barS+=e.summe;}
else{ecR+=e.rasen;ecB+=e.bio;ecS+=e.summe;}

});

html+=`<tr><td colspan="2"><b>BAR</b></td><td>${barR}</td><td>${barB}</td><td>${barS}</td></tr>`;
html+=`<tr><td colspan="2"><b>EC</b></td><td>${ecR}</td><td>${ecB}</td><td>${ecS}</td></tr>`;
html+=`<tr><td colspan="2"><b>GESAMT</b></td><td>${barR+ecR}</td><td>${barB+ecB}</td><td>${barS+ecS}</td></tr>`;

html+="</table>";

document.getElementById("heute").innerHTML=html;

kundenListe(daten);
}

function bearbeiten(i){
const daten=JSON.parse(localStorage.getItem("humix"));
editIndex=i;
const e=daten[i];
for(let k in e){
if(document.getElementById(k))document.getElementById(k).value=e[k];
}
}

function loeschen(i){
const daten=JSON.parse(localStorage.getItem("humix"));
daten.splice(i,1);
localStorage.setItem("humix",JSON.stringify(daten));
anzeigen();
}

function kundenListe(daten){
let map={};

daten.forEach(e=>{
let key=e.ort+"_"+(e.name||"");
map[key]=e;
});

let html="<table><tr><th>Ort</th><th>Name</th><th>Adresse</th><th>Letzter Kauf</th><th></th><th></th></tr>";

Object.values(map).forEach(e=>{
html+=`<tr>
<td>${e.ort}</td>
<td>${e.name||"(kein Name)"}</td>
<td>${e.strasse} ${e.hausnr}, ${e.plz}</td>
<td>R:${e.rasen} B:${e.bio} €${e.summe}</td>
<td><button class="smallbtn blue" onclick="bearbeitenKunde('${e.ort}','${e.name}')">✏️</button></td>
<td><button class="smallbtn red" onclick="kundeLoeschen('${e.ort}','${e.name}')">🗑</button></td>
</tr>`;
});

html+="</table>";
document.getElementById("kunden").innerHTML=html;
}

function bearbeitenKunde(ort,name){
const daten=JSON.parse(localStorage.getItem("humix"));
let last=daten.reverse().find(e=>e.ort===ort && e.name===name);
if(!last)return;
for(let k in last){
if(document.getElementById(k))document.getElementById(k).value=last[k];
}
}

function kundeLoeschen(ort,name){
let daten=JSON.parse(localStorage.getItem("humix"));
daten=daten.filter(e=>!(e.ort===ort && e.name===name));
localStorage.setItem("humix",JSON.stringify(daten));
anzeigen();
}

function exportTagesCSV(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]");
let csv="Datum;Uhr;Ort;Name;Rasen;Bio;Zahlung;Summe\n";
daten.forEach(e=>{
csv+=`${e.datum};${e.uhr};${e.ort};${e.name};${e.rasen};${e.bio};${e.zahlung};${e.summe}\n`;
});
download(csv,"tagesliste.csv");
}

function exportZusammenfassung(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]");
let bar=0,ec=0;
daten.forEach(e=>{
if(e.zahlung==="Bar")bar+=e.summe;
else ec+=e.summe;
});
let csv="Datum;Bar;EC;Gesamt\n";
csv+=`${heuteDatum()};${bar};${ec};${bar+ec}`;
download(csv,"tagessummen.csv");
}

function exportKundenCSV(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]");
let csv="Ort;Name;Telefon;Adresse\n";
daten.forEach(e=>{
csv+=`${e.ort};${e.name};${e.telefon};${e.strasse} ${e.hausnr} ${e.plz}\n`;
});
download(csv,"kunden.csv");
}

function exportKundenXLS(){
const daten=JSON.parse(localStorage.getItem("humix")||"[]");
const ws=XLSX.utils.json_to_sheet(daten);
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Kunden");
XLSX.writeFile(wb,"kunden.xlsx");
}

function download(text,name){
const blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=name;
a.click();
}

anzeigen();

</script>
</body>
</html>
