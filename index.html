<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HÜMIX Einsatz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f4f7f4; margin:0; padding:10px; }
h1,h2 { color:#2e7d32; }
label { font-weight:bold; display:block; margin-top:10px; }
input, select, button {
  width:100%; padding:10px; margin-top:5px;
  font-size:16px; box-sizing:border-box;
}
button { border:none; color:#fff; cursor:pointer; margin-top:10px; }
.green { background:#2e7d32; }
.blue { background:#1976d2; }
.gray { background:#455a64; }
.purple { background:#6a1b9a; }
.orange { background:#ef6c00; }
.red { background:#c62828; }
.status { margin-top:10px; font-size:14px; }

table { width:100%; border-collapse:collapse; margin-top:15px; background:#fff; }
th,td { border:1px solid #ccc; padding:6px; font-size:14px; }
th { background:#e8f5e9; }
.bar { background:#e8f5e9; }
.ec { background:#e3f2fd; }
.ortHeader { background:#c8e6c9; font-weight:bold; }
.sumRow { background:#f1f8e9; font-weight:bold; }
.actionBtn { padding:4px 6px; font-size:12px; }
</style>
</head>

<body>

<h1>🌱 HÜMIX Einsatz</h1>

<input type="hidden" id="editId">

<label>Name</label>
<input id="name" placeholder="optional">

<label>Telefon</label>
<input id="telefon" inputmode="tel">

<label>Straße</label>
<input id="strasse">

<label>Hausnummer</label>
<input id="hausnr">

<label>PLZ</label>
<input id="plz">

<label>Ort</label>
<input id="ort">

<label>Rasen Spezial – Säcke (45 €)</label>
<input id="rasen" type="number" value="0">

<label>Bio-Volldünger – Säcke (30 €)</label>
<input id="bio" type="number" value="0">

<label>Ausgestreut</label>
<select id="ausgestreut">
  <option>Ja</option>
  <option>Nein</option>
</select>

<label>Zahlungsart</label>
<select id="zahlung">
  <option>Bar</option>
  <option>EC</option>
</select>

<button class="blue" onclick="gpsHolen()">📍 GPS neu holen</button>
<div class="status" id="gpsStatus">GPS noch nicht ermittelt</div>

<button class="green" onclick="speichern()">💾 Speichern</button>
<button class="blue" onclick="felderLeeren()">➕ Neuer Eintrag</button>

<button class="gray" onclick="exportTagesCSV()">📄 Tages-CSV</button>
<button class="orange" onclick="exportXLSX()">📊 Excel-XLSX</button>
<button class="purple" onclick="exportZusammenfassung()">📊 Tageszusammenfassung CSV</button>
<button class="red" onclick="allesLoeschen()">🗑 Alle Daten löschen</button>

<div class="status" id="status">Bereit.</div>

<h2>📋 Heutige Einträge (nach Ort)</h2>

<table>
<thead>
<tr>
<th>Uhrzeit</th>
<th>Ort – Name</th>
<th>Rasen</th>
<th>Bio</th>
<th>Zahlung</th>
<th>€</th>
<th>Aktion</th>
</tr>
</thead>
<tbody id="tabelleHeute"></tbody>
</table>

<script>
let lat=null, lon=null;

function heuteDatum(){
  return new Date().toLocaleDateString("de-DE");
}

/* ================= GPS ================= */
function gpsHolen(){
  felderLeeren();
  gpsStatus.innerText="GPS wird ermittelt…";
  navigator.geolocation.getCurrentPosition(p=>{
    lat=p.coords.latitude; lon=p.coords.longitude;
    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
      .then(r=>r.json()).then(d=>{
        strasse.value=d.address?.road||"";
        hausnr.value=d.address?.house_number||"";
        plz.value=d.address?.postcode||"";
        ort.value=d.address?.city||d.address?.town||d.address?.village||"";
        gpsStatus.innerText=`GPS OK: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      });
  });
}

/* ================= SPEICHERN ================= */
function speichern(){
  const daten=JSON.parse(localStorage.getItem("humix")||"[]");

  const nameVal = name.value.trim() || "(kein Name)";
  const rasenVal=Number(rasen.value||0);
  const bioVal=Number(bio.value||0);
  const summe=rasenVal*45+bioVal*30;

  const eintrag={
    id: editId.value||crypto.randomUUID(),
    datum: heuteDatum(),
    uhrzeit: new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
    name: nameVal,
    telefon: telefon.value||"",
    strasse: strasse.value||"",
    hausnr: hausnr.value||"",
    plz: plz.value||"",
    ort: ort.value||"",
    rasen: rasenVal,
    bio: bioVal,
    ausgestreut: ausgestreut.value,
    zahlung: zahlung.value,
    summe
  };

  const idx=daten.findIndex(e=>e.id===eintrag.id);
  if(idx>=0) daten[idx]=eintrag; else daten.push(eintrag);

  localStorage.setItem("humix",JSON.stringify(daten));
  status.innerText="Gespeichert ✔";
  felderLeeren();
  ladeHeute();
}

/* ================= TABELLE HEUTE ================= */
function ladeHeute(){
  const daten=JSON.parse(localStorage.getItem("humix")||"[]")
    .filter(e=>e.datum===heuteDatum())
    .sort((a,b)=>(a.ort.localeCompare(b.ort)||a.uhrzeit.localeCompare(b.uhrzeit)));

  const tbody=tabelleHeute;
  tbody.innerHTML="";

  let aktuellerOrt="", ortSumme=0;

  daten.forEach(e=>{
    if(e.ort!==aktuellerOrt){
      if(aktuellerOrt){
        tbody.innerHTML+=`<tr class="sumRow"><td colspan="5">Zwischensumme ${aktuellerOrt}</td><td>${ortSumme}</td><td></td></tr>`;
      }
      aktuellerOrt=e.ort;
      ortSumme=0;
      tbody.innerHTML+=`<tr class="ortHeader"><td colspan="7">${aktuellerOrt}</td></tr>`;
    }

    ortSumme+=e.summe;

    tbody.innerHTML+=`
      <tr class="${e.zahlung==='Bar'?'bar':'ec'}">
        <td>${e.uhrzeit}</td>
        <td>${e.ort} – ${e.name}</td>
        <td>${e.rasen}</td>
        <td>${e.bio}</td>
        <td>${e.zahlung}</td>
        <td>${e.summe}</td>
        <td>
          <button class="blue actionBtn" onclick="bearbeiten('${e.id}')">✏️</button>
          <button class="red actionBtn" onclick="loeschen('${e.id}')">🗑</button>
        </td>
      </tr>`;
  });

  if(aktuellerOrt){
    tbody.innerHTML+=`<tr class="sumRow"><td colspan="5">Zwischensumme ${aktuellerOrt}</td><td>${ortSumme}</td><td></td></tr>`;
  }
}

/* ================= BEARBEITEN / LÖSCHEN ================= */
function bearbeiten(id){
  const e=JSON.parse(localStorage.getItem("humix")).find(x=>x.id===id);
  editId.value=e.id;
  Object.keys(e).forEach(k=>{
    if(document.getElementById(k) && k!=="id") document.getElementById(k).value=e[k];
  });
}

function loeschen(id){
  if(!confirm("Eintrag löschen?")) return;
  const daten=JSON.parse(localStorage.getItem("humix")).filter(e=>e.id!==id);
  localStorage.setItem("humix",JSON.stringify(daten));
  ladeHeute();
}

/* ================= RESET ================= */
function felderLeeren(){
  editId.value="";
  ["name","telefon","strasse","hausnr","plz","ort"].forEach(i=>document.getElementById(i).value="");
  rasen.value=0; bio.value=0;
}

/* ================= CSV ================= */
function exportTagesCSV(){
  const daten=JSON.parse(localStorage.getItem("humix")||"[]");
  if(!daten.length) return alert("Keine Daten");

  let csv="Datum;Uhrzeit;Name;Telefon;Straße;Hausnr;PLZ;Ort;Rasen;Bio;Ausgestreut;Zahlung;Summe €\n";
  daten.forEach(e=>{
    const tel=String(e.telefon||"").replace(/"/g,'""');
    csv+=`${e.datum};${e.uhrzeit};${e.name};="${tel}";${e.strasse};${e.hausnr};${e.plz};${e.ort};${e.rasen};${e.bio};${e.ausgestreut};${e.zahlung};${e.summe}\n`;
  });
  downloadCSV(csv,"humix_tagesliste.csv");
}

/* ================= XLSX ================= */
function exportXLSX(){
  const daten=JSON.parse(localStorage.getItem("humix")||"[]");
  if(!daten.length) return alert("Keine Daten");

  const sheetData=[["Datum","Uhrzeit","Name","Telefon","Straße","Hausnr","PLZ","Ort","Rasen","Bio","Ausgestreut","Zahlung","Summe €"]];
  daten.forEach(e=>{
    sheetData.push([e.datum,e.uhrzeit,e.name,e.telefon,e.strasse,e.hausnr,e.plz,e.ort,e.rasen,e.bio,e.ausgestreut,e.zahlung,e.summe]);
  });

  const ws=XLSX.utils.aoa_to_sheet(sheetData);
  ws["!cols"]=sheetData[0].map((_,i)=>({wch:Math.max(...sheetData.map(r=>String(r[i]||"").length))+2}));

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"HÜMIX");
  XLSX.writeFile(wb,"humix_tagesliste.xlsx");
}

/* ================= ZUSAMMENFASSUNG ================= */
function exportZusammenfassung(){
  const daten=JSON.parse(localStorage.getItem("humix")||"[]");
  if(!daten.length) return alert("Keine Daten");

  const datum=daten[0].datum;
  let bR=0,bB=0,bS=0,eR=0,eB=0,eS=0;

  daten.forEach(e=>{
    if(e.zahlung==="Bar"){bR+=e.rasen;bB+=e.bio;bS+=e.summe;}
    if(e.zahlung==="EC"){eR+=e.rasen;eB+=e.bio;eS+=e.summe;}
  });

  let csv="Datum;Zahlung;Rasen Säcke;Bio Säcke;Summe €\n";
  csv+=`${datum};Bar;${bR};${bB};${bS}\n`;
  csv+=`${datum};EC;${eR};${eB};${eS}\n`;
  csv+=`${datum};GESAMT;${bR+eR};${bB+eB};${bS+eS}`;

  downloadCSV(csv,"humix_tageszusammenfassung.csv");
}

/* ================= DOWNLOAD ================= */
function downloadCSV(text,name){
  const blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
}

/* ================= ALLES LÖSCHEN ================= */
function allesLoeschen(){
  if(confirm("Wirklich alle Daten löschen?")){
    localStorage.removeItem("humix");
    ladeHeute();
  }
}

window.onload=ladeHeute;
</script>
</body>
</html>
